    <title>関西大学 千里山キャンパス 3D MAP | Kansai Univ. 3D Campus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->

    <!-- Tween.js for smooth camera animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1522;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Apple Maps-like frosted glass */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .glass-panel-dark {
            background: rgba(22, 32, 51, 0.88);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* POI Marker styling */
        .poi-marker {
            position: absolute;
            transform: translate(-50%, -100%);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }

        .poi-marker:hover {
            transform: translate(-50%, -115%) scale(1.18);
            z-index: 50 !important;
        }

        .poi-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
        }

        .poi-label {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 2.5px 7.5px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            transition: all 0.2s;
        }

        /* Hide scrollbars for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Loading spinner */
        .loader {
            border: 3.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border-top: 3.5px solid #3b82f6;
            width: 42px;
            height: 42px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        // ==========================================
        // 3. Procedural Texture Generators
        // ==========================================
        function createTrackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#b44837';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            const cx = 512, cy = 512;
            const rw = 400, rh = 280;

            for (let i = 0; i < 6; i++) {
                const w = rw - i * 16;
                const h = rh - i * 16;
                ctx.beginPath();
                ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#487937';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rw - 96, rh - 96, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 4;
            ctx.strokeRect(cx - 200, cy - 120, 400, 240);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 120);
            ctx.lineTo(cx, cy + 120);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, Math.PI * 2);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        function createBaseballTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#4a7f3c';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = '#aa8055';
            ctx.beginPath();
            ctx.moveTo(256, 450);
            ctx.arc(256, 450, 280, -Math.PI * 0.85, -Math.PI * 0.15);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#4a7f3c';
            ctx.beginPath();
            ctx.moveTo(256, 380);
            ctx.lineTo(190, 310);
            ctx.lineTo(256, 240);
            ctx.lineTo(322, 310);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#b5885c';
            ctx.beginPath();
            ctx.arc(256, 310, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(256, 450);
            ctx.lineTo(40, 150);
            ctx.moveTo(256, 450);
            ctx.lineTo(472, 150);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);

        // 3.5 Apple Park Style Glowing Ribbon Window & Louver Textures
        function createAppleParkWindowTextures(wallColorHex, floors = 4, repeatX = 4, style = 'ribbon') {
            const width = 512;
            const height = 256;

            // Color Texture Canvas
            const colCanvas = document.createElement('canvas');
            colCanvas.width = width;
            colCanvas.height = height;
            const cCtx = colCanvas.getContext('2d');

            // Emissive Texture Canvas (Controls glowing window bands)
            const emiCanvas = document.createElement('canvas');
            emiCanvas.width = width;
            emiCanvas.height = height;
            const eCtx = emiCanvas.getContext('2d');

            // Fill base wall
            const hexStr = '#' + new THREE.Color(wallColorHex).getHexString();
            cCtx.fillStyle = hexStr;
            cCtx.fillRect(0, 0, width, height);

            eCtx.fillStyle = '#000000';
            eCtx.fillRect(0, 0, width, height);

            const floorH = height / floors;

            for (let f = 0; f < floors; f++) {
                const yTop = f * floorH;
                // Window band dimensions (Balanced wall spandrel + Apple Park glowing ribbon glass)
                const winMarginTop = style === 'pavilion' ? floorH * 0.18 : floorH * 0.34;
                const winMarginBottom = style === 'pavilion' ? floorH * 0.14 : floorH * 0.20;
                const winY = yTop + winMarginTop;
                const winH = floorH - winMarginTop - winMarginBottom;

                // Dark architectural shadow line right above window
                cCtx.fillStyle = 'rgba(15, 23, 42, 0.55)';
                cCtx.fillRect(0, winY - 3, width, 3);

                // Warm glowing interior gradient (Apple Park creamy champagne light)
                const gradCol = cCtx.createLinearGradient(0, winY, 0, winY + winH);
                gradCol.addColorStop(0, '#fffef5');
                gradCol.addColorStop(0.45, '#ffebb3');
                gradCol.addColorStop(1, '#eab85c');
                cCtx.fillStyle = gradCol;
                cCtx.fillRect(0, winY, width, winH);

                const gradEmi = eCtx.createLinearGradient(0, winY, 0, winY + winH);
                gradEmi.addColorStop(0, '#ffffff');
                gradEmi.addColorStop(0.5, '#ffe699');
                gradEmi.addColorStop(1, '#d4a348');
                eCtx.fillStyle = gradEmi;
                eCtx.fillRect(0, winY, width, winH);

                // Subtle room light variation along the ribbon while keeping Apple Park continuity
                const segments = style === 'pavilion' ? 10 : 16;
                const segW = width / segments;
                for (let s = 0; s < segments; s++) {
                    const seed = Math.sin((f + 1) * 19.7 + (s + 1) * 31.3) * 0.5 + 0.5;
                    if (seed < 0.18 && style !== 'pavilion') {
                        cCtx.fillStyle = 'rgba(30, 42, 62, 0.45)';
                        cCtx.fillRect(s * segW, winY, segW, winH);
                        eCtx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                        eCtx.fillRect(s * segW, winY, segW, winH);
                    } else if (seed > 0.72) {
                        eCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        eCtx.fillRect(s * segW, winY, segW, winH);
                    }

                    // Crisp vertical mullions (Apple Park glass curtain wall dividers)
                    const mullionW = style === 'pavilion' ? 2.5 : 4.5;
                    cCtx.fillStyle = style === 'pavilion' ? 'rgba(180, 195, 210, 0.75)' : hexStr;
                    cCtx.fillRect(s * segW, winY, mullionW, winH);
                    eCtx.fillStyle = '#000000';
                    eCtx.fillRect(s * segW, winY, mullionW - 0.5, winH);
                }

                // White horizontal louver canopy strip (Signature Apple Park ring look)
                const louverH = Math.max(3, floorH * 0.09);
                cCtx.fillStyle = '#f1f5f9';
                cCtx.fillRect(0, winY - louverH, width, louverH);
                eCtx.fillStyle = '#8a7f68';
                eCtx.fillRect(0, winY - louverH * 0.5, width, louverH * 0.5);
            }

            const colorTex = new THREE.CanvasTexture(colCanvas);
            colorTex.wrapS = THREE.RepeatWrapping;
            colorTex.wrapT = THREE.ClampToEdgeWrapping;
            colorTex.repeat.set(repeatX, 1);

            const emissiveTex = new THREE.CanvasTexture(emiCanvas);
            emissiveTex.wrapS = THREE.RepeatWrapping;
            emissiveTex.wrapT = THREE.ClampToEdgeWrapping;
            emissiveTex.repeat.set(repeatX, 1);

            return { colorTex, emissiveTex };
        }

        // Create a building facade material with Apple Park glowing windows
        function createFacadeMat(dayColor, nightColor, floors = 4, repeatX = 3, style = 'ribbon') {
            const { colorTex, emissiveTex } = createAppleParkWindowTextures(dayColor, floors, repeatX, style);
            const mat = new THREE.MeshStandardMaterial({
                map: colorTex,
                emissiveMap: emissiveTex,
                emissive: new THREE.Color(0xffeeb5),
                emissiveIntensity: 0.72, // Warmly lit even in day mode, intense in dark mode
                roughness: 0.45,
                metalness: 0.15
            });
            mat.userData = {
                dayColor: 0xffffff, // Keep texture true in day
                nightColor: 0x9fb4d4, // Cool slate tint on non-emissive walls at night
                dayRough: 0.45,
                nightRough: 0.35,
                dayEmissive: 0.72,
                nightEmissive: 1.55
            };
            windowMaterials.push(mat);
            return mat;
        }

        // Create glowing white louver/base trim material (like Apple Park ring fins & ground glow)
        function createGlowTrimMat() {
            const mat = new THREE.MeshStandardMaterial({

                emissiveIntensity: 0.35,
                roughness: 0.3,
                metalness: 0.1
            });
            glowTrimMaterials.push(mat);
            return mat;
        }

        // 3.6 Soft Radial Glow Particle Texture for Fireworks
        function createSparkTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.25, 'rgba(255, 250, 220, 0.9)');
            grad.addColorStop(0.6, 'rgba(255, 220, 150, 0.35)');
            grad.addColorStop(1, 'rgba(255, 200, 100, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================================
        // 4. Initialization
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(PALETTE.day.bg);
            scene.fog = new THREE.FogExp2(PALETTE.day.fog, 0.00055);

            // 2. Camera (Wider 55° default FOV & extended far plane for wide panoramic views)
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 2500);
            camera.position.set(0, 185, 250);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // 4. Controls (Expanded zoom range: 12 to 900)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2.08;
            controls.minDistance = 12;
            controls.maxDistance = 900;
            controls.target.set(0, 5, 0);

            // 5. Lighting Setup
            setupLighting();

            // 6. Build World Geometry
            buildCampus();

            // 7. Setup POI Markers
            createPoiMarkers();

            // 8. Event Listeners & UI Binding
            setupUI();

            // Smoothly remove loading screen
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 600);
                }
            }, 300);

            // Window resize
            window.addEventListener('resize', onWindowResize);

            // Raycasting for direct building click
            renderer.domElement.addEventListener('pointerup', onPointerClick);

            // Render loop
            animate();
        }

        // ==========================================
        // 5. Lighting Setup
        // ==========================================
        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
            scene.add(ambientLight);

            // Sun (Day Light)
            sunLight = new THREE.DirectionalLight(0xfff6e8, 1.15);
            sunLight.position.set(-120, 240, 130);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.near = 20;
            sunLight.shadow.camera.far = 700;
            const d = 260;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0004;
            scene.add(sunLight);

            // Moon Light (for Night Mode - photo 1 slate blue lighting)

            moonLight.shadow.camera.top = d;
            moonLight.shadow.camera.bottom = -d;
            scene.add(moonLight);
        }

        // Helper to register material for day/night sync
        function registerMat(material, dayColor, nightColor, dayRough = 0.7, nightRough = 0.6) {
            material.color.setHex(dayColor);
            material.roughness = dayRough;
            material.userData = { dayColor, nightColor, dayRough, nightRough };
            dayMaterials.push(material);
            return material;
        }

        // ==========================================
        // 6. Campus 3D Construction
        // ==========================================
        function buildCampus() {
            // --- Grounds & Road Bases ---
            const matCityGround = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.ground, PALETTE.night.ground, 0.9, 0.8);
            cityGround = new THREE.Mesh(new THREE.PlaneGeometry(2200, 2200), matCityGround);
            cityGround.rotation.x = -Math.PI / 2;
            cityGround.receiveShadow = true;
            scene.add(cityGround);

            // Campus Main Paving Area
            const matCampusPaving = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.campusPaving, PALETTE.night.campusPaving, 0.8, 0.7);
            campusGround = new THREE.Mesh(new THREE.PlaneGeometry(360, 310), matCampusPaving);
            campusGround.rotation.x = -Math.PI / 2;
            campusGround.position.set(-5, 0.08, -10);
            campusGround.receiveShadow = true;
            scene.add(campusGround);

            // Turf & Grass helper
            const addGrass = (x, z, w, d, isTurf = false, ry = 0) => {
                const dayCol = isTurf ? PALETTE.day.turf : PALETTE.day.grass;
                const nightCol = isTurf ? PALETTE.night.turf : PALETTE.night.grass;
                const mat = registerMat(new THREE.MeshStandardMaterial({ flatShading: true }), dayCol, nightCol, 0.95, 0.9);
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.rotation.z = ry;
                mesh.position.set(x, 0.14, z);
                mesh.receiveShadow = true;
                scene.add(mesh);
                return mesh;
            };

            // Main Green Spaces (Aligned with Apple Maps 2D & 3D footprints)
            addGrass(-134, -64, 42, 62, true, -0.58); // 中央体育館北西の斜めグリーンフィールド
            addGrass(5, 12, 44, 36, false, -0.46);    // 悠久の庭 (Central Plaza Lawn)
            addGrass(-62, 32, 36, 24, false, -0.15);  // 博物館南広場
            addGrass(-26, 44, 48, 16, false, -0.15);  // 尚文館〜以文館間緑地
            addGrass(135, 10, 32, 160, false, -0.25); // 千里山トンネル沿い東側グリーンベルト

            // Common Solid Materials (Roofs, Caps, Pillars)
            const matBrick = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.brick, PALETTE.night.brick);
            const matBrickLight = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.brickLight, PALETTE.night.brickLight);
            const matWhite = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.whiteWall, PALETTE.night.whiteWall);
            const matGrey = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.greyWall, PALETTE.night.greyWall);
            const matDarkRoof = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.darkRoof, PALETTE.night.darkRoof);
            const matDomeGreen = registerMat(new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.1 }), PALETTE.day.domeGreen, PALETTE.night.domeGreen);
            const matRoofGreen = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.greenRoof, PALETTE.night.greenRoof);
            const matGlowTrim = createGlowTrimMat();

            // Apple Park Style Glowing Facade Materials (Side walls with warm glowing ribbon windows)
            const facBrick4 = createFacadeMat(PALETTE.day.brick, PALETTE.night.brick, 4, 4, 'ribbon');
            const facBrickLight4 = createFacadeMat(PALETTE.day.brickLight, PALETTE.night.brickLight, 4, 4, 'ribbon');
            const facBrick3 = createFacadeMat(PALETTE.day.brick, PALETTE.night.brick, 3, 3, 'ribbon');
            const facWhite4 = createFacadeMat(PALETTE.day.whiteWall, PALETTE.night.whiteWall, 4, 4, 'ribbon');
            const facWhite6 = createFacadeMat(PALETTE.day.whiteWall, PALETTE.night.whiteWall, 6, 5, 'ribbon');
            const facGrey3 = createFacadeMat(PALETTE.day.greyWall, PALETTE.night.greyWall, 3, 4, 'pavilion');
            const facPavilion = createFacadeMat(PALETTE.day.brick, PALETTE.night.brick, 3, 5, 'pavilion');

            const boxMats = (sideMat, capMat = matDarkRoof) => [sideMat, sideMat, capMat, capMat, sideMat, sideMat];
            const cylMats = (sideMat, capMat = matDarkRoof) => [sideMat, capMat, capMat];

            // Helper: Add 3D Apple Park style horizontal louver fins & glowing ground base rim
            const addBoxLouvers = (group, w, h, d, floors = 4, ox = 0, oz = 0, ry = 0) => {
                const lGrp = new THREE.Group();
                lGrp.position.set(ox, 0, oz);
                lGrp.rotation.y = ry;

                const baseRim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.9, 0.35, d + 0.9), matGlowTrim);
                baseRim.position.y = 0.2;
                lGrp.add(baseRim);

                for (let f = 1; f <= floors; f++) {
                    const fy = (h / floors) * f - 0.15;
                    const fin = new THREE.Mesh(new THREE.BoxGeometry(w + 0.65, 0.26, d + 0.65), matGlowTrim);
                    fin.position.y = fy;
                    fin.castShadow = true;
                    lGrp.add(fin);
                }
                group.add(lGrp);
            };

            const addCylinderLouvers = (group, radius, h, floors = 3, ox = 0, oz = 0) => {
                const lGrp = new THREE.Group();
                lGrp.position.set(ox, 0, oz);

                const baseRim = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.6, radius + 0.6, 0.35, 36), matGlowTrim);
                baseRim.position.y = 0.2;
                lGrp.add(baseRim);

                for (let f = 1; f <= floors; f++) {
                    const fy = (h / floors) * f - 0.15;
                    const fin = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.45, radius + 0.45, 0.26, 36), matGlowTrim);
                    fin.position.y = fy;
                    fin.castShadow = true;
                    lGrp.add(fin);
                }
                group.add(lGrp);
            };

            // Compound Sub-Box helper to accurately build complex multi-wing footprints from Apple Maps
            const addSubBox = (parentGrp, ox, oz, w, h, d, bodyMat, poiId = null, ry = 0, roofMat = matDarkRoof) => {
                let appliedMat = bodyMat;
                const floors = Math.max(2, Math.round(h / 3.8));
                if (poiId) {
                    if (bodyMat === matBrick) appliedMat = boxMats(facBrick4, matBrick);
                    else if (bodyMat === matBrickLight) appliedMat = boxMats(facBrickLight4, matBrickLight);
                    else if (bodyMat === matWhite) appliedMat = boxMats(floors >= 5 ? facWhite6 : facWhite4, matWhite);
                    else if (bodyMat === matGrey) appliedMat = boxMats(facGrey3, matGrey);
                }

                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), appliedMat);
                mesh.position.set(ox, h / 2, oz);
                mesh.rotation.y = ry;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                if (poiId) {
                    mesh.userData.poiId = poiId;
                    clickableObjects.push(mesh);
                }
                parentGrp.add(mesh);

                if (poiId) {
                    addBoxLouvers(parentGrp, w, h, d, Math.min(5, floors), ox, oz, ry);
                }

                if (roofMat) {
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.4, 0.55, d + 0.4), roofMat);
                    roof.position.set(ox, h + 0.28, oz);
                    roof.rotation.y = ry;
                    roof.castShadow = true;
                    if (poiId) {
                        roof.userData.poiId = poiId;
                        clickableObjects.push(roof);
                    }
                    parentGrp.add(roof);
                }
                return mesh;
            };

            const addSubCyl = (parentGrp, ox, oz, r, h, sideFacade, poiId = null, roofMat = matDarkRoof) => {
                const cyl = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 36), cylMats(sideFacade, roofMat));
                cyl.position.set(ox, h / 2, oz);
                cyl.castShadow = true;
                cyl.receiveShadow = true;
                if (poiId) {
                    cyl.userData.poiId = poiId;
                    clickableObjects.push(cyl);
                }
                parentGrp.add(cyl);

                if (poiId) {
                    addCylinderLouvers(parentGrp, r, h, Math.max(2, Math.round(h / 4)), ox, oz);
                }

                const cap = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.5, r + 0.5, 0.6, 36), roofMat);
                cap.position.set(ox, h + 0.3, oz);
                cap.castShadow = true;
                if (poiId) {
                    cap.userData.poiId = poiId;
                    clickableObjects.push(cap);
                }
                parentGrp.add(cap);
                return cyl;
            };

            // Generic Standalone Building Creator
            const createBoxBuilding = (x, z, w, h, d, ry, bodyMat, roofMat = matDarkRoof, roofOverhang = 0.4, poiId = null) => {
                const group = new THREE.Group();
                group.position.set(x, 0, z);
                group.rotation.y = ry;
                addSubBox(group, 0, 0, w, h, d, bodyMat, poiId, 0, roofMat);
                scene.add(group);
                return group;

            // 1. 関西大学 総合図書館 (General Library) & イノベーション創生センター

            const cyanZoneBorderMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 });

            // Helper: Create crisp floating number badge sprite for tents & trash bins (Always visible on top)
            const makeLabelSprite = (text, bgHex = '#ffffff', borderHex = '#0284c7', textHex = '#0f172a', scaleW = 3.6, scaleH = 1.85) => {
                const c = document.createElement('canvas');
                c.width = 160;
                c.height = 84;
                const ctx = c.getContext('2d');

                // Rounded pill background
                const r = 18;
                ctx.fillStyle = bgHex;
                ctx.strokeStyle = borderHex;
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.roundRect(6, 6, 148, 72, r);
                ctx.fill();
                ctx.stroke();

                // Crisp label text
                ctx.fillStyle = textHex;
                ctx.font = '900 42px "Inter", "Noto Sans JP", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 80, 45);

                const tex = new THREE.CanvasTexture(c);
                tex.needsUpdate = true;
                const sMat = new THREE.SpriteMaterial({
                    map: tex,
                    transparent: true,
                    depthTest: false,
                    depthWrite: false
                });
                const sprite = new THREE.Sprite(sMat);
                sprite.scale.set(scaleW, scaleH, 1);
                sprite.renderOrder = 999;
                return sprite;
            };

            // Helper: Build a single small 3D festival tent with its assigned number & register for Search
            const addSmallTent = (parent, x, z, label, valanceHex = 0x38bdf8, badgeBg = '#fffbeb', ry = 0, w = 2.0, d = 2.0, areaName = 'キャンパス内テントエリア') => {

                    hours: 'イベント開催時間'

            // Helper: Draw Light-Blue Rectangular Zone Frame (水色四角) on the ground

            // -----------------------------------------------------------------

            // -----------------------------------------------------------------

            const zone8Ids = [

        // ==========================================
        // 7. POI Overlay Markers Creation
        // ==========================================
        function createPoiMarkers() {
            const container = document.getElementById('poi-container');
            container.innerHTML = '';
            poiElements = [];

            POI_DATA.forEach(poi => {
                const el = document.createElement('div');
                el.className = 'poi-marker';
                el.dataset.id = poi.id;

                el.innerHTML = `
                    <div class="poi-pin" style="background-color: ${poi.color};">
                        <i data-lucide="${poi.icon}" class="w-4 h-4 text-white"></i>
                    </div>
                    <div class="poi-label bg-white/95 text-gray-800 border border-black/10">
                        ${poi.name.split(' (')[0].split(' /')[0]}
                    </div>
                `;

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    focusOnPoi(poi.id);
                });

                container.appendChild(el);
                poiElements.push({
                    id: poi.id,
                    element: el,
                    worldPos: new THREE.Vector3(poi.pos[0], poi.pos[1], poi.pos[2])
                });
            });

            lucide.createIcons();
        }

        const tempV = new THREE.Vector3();
        function updatePoiPositions() {
            if (!showLabels) {
                document.getElementById('poi-container').style.display = 'none';
                return;
            }
            document.getElementById('poi-container').style.display = 'block';

            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;

            poiElements.forEach(item => {
                tempV.copy(item.worldPos);
                tempV.project(camera);

                if (tempV.z > 1) {
                    item.element.style.display = 'none';
                    return;
                }

                const x = (tempV.x * halfW) + halfW;
                const y = -(tempV.y * halfH) + halfH;

                item.element.style.display = 'block';
                item.element.style.left = `${x}px`;
                item.element.style.top = `${y}px`;

                const dist = camera.position.distanceTo(item.worldPos);
                const scale = Math.max(0.65, Math.min(1.08, 140 / dist));
                item.element.style.transform = `translate(-50%, -100%) scale(${scale})`;
            });
        }

        // ==========================================
        // 8. Interactive Camera Movement & Focus
        // ==========================================
        function animateCamera(targetCamPos, targetLookAt, duration = 1200) {
            new TWEEN.Tween(camera.position)
                .to({ x: targetCamPos[0], y: targetCamPos[1], z: targetCamPos[2] }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: targetLookAt[0], y: targetLookAt[1], z: targetLookAt[2] }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        }

            const poi = POI_DATA.find(p => p.id === id) || TENT_AND_BIN_DATA.find(t => t.id === id);

            selectedPoiId = id;

            animateCamera(poi.camPos, [poi.pos[0], 0, poi.pos[2]]);

        // Click Raycasting on 3D Buildings
        function onPointerClick(e) {
            // Disable building tap explanation when facility navigation is hidden
            if (!showLabels) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const targetObj = intersects[0].object;
                if (targetObj.userData && targetObj.userData.poiId) {
                    focusOnPoi(targetObj.userData.poiId);
                }
            }
        }

        // ==========================================
        // 8.5 Museum Front Fireworks System (Dark Mode & Super Boost)
        // ==========================================
        const FIREWORK_PALETTES = [
            [0xffca28, 0xffe082, 0xff8f00], // Rich Gold & Amber
            [0xff4081, 0xff80ab, 0xffd54f], // Vivid Sakura Pink & Gold
            [0x00e5ff, 0x64ffda, 0xffeb3b], // Electric Cyan & Emerald Gold
            [0xd500f9, 0xff4081, 0xffe57f], // Royal Magenta & Gold
            [0xff5252, 0xffca28, 0x00e676, 0x40c4ff, 0xe040fb], // Rainbow Star
            [0xfff59d, 0xffd54f, 0xffb300, 0xffffff] // Golden Kamuro Willow
        ];

        function launchMuseumFirework(instantBurst = false, forceBoost = null) {
            if (!sparkTexture) sparkTexture = createSparkTexture();

            const boosted = forceBoost !== null ? forceBoost : isFireworkBoost;

            // Museum rotunda is at [-58, 0, 18], front plaza is around [-58, 0, 26]
            const spreadX = boosted ? 40 : 16;
            const spreadZ = boosted ? 22 : 8;
            const startX = -58 + (Math.random() - 0.5) * spreadX;
            const startZ = 26 + (Math.random() - 0.5) * spreadZ;
            const targetY = boosted ? (24 + Math.random() * 19) : (23 + Math.random() * 9);
            const palette = FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];

            const fw = {
                phase: instantBurst ? 'burst' : 'ascend',
                x: startX,
                y: instantBurst ? targetY : 1.5,
                z: startZ,
                targetY: targetY,
                vy: boosted ? (30 + Math.random() * 10) : (23 + Math.random() * 5),
                palette: palette,
                boosted: boosted,
                age: 0,
                maxLife: boosted ? (1.85 + Math.random() * 0.45) : (1.5 + Math.random() * 0.35),
                rocketMesh: null,
                burstPoints: null,
                velocities: []
            };

            if (!instantBurst) {
                const rocketGeo = new THREE.BufferGeometry();
                const posArr = new Float32Array(7 * 3);
                for (let i = 0; i < 7; i++) {
                    posArr[i * 3] = startX;
                    posArr[i * 3 + 1] = fw.y - i * 0.55;
                    posArr[i * 3 + 2] = startZ;
                }
                rocketGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                const rocketMat = new THREE.PointsMaterial({
                    size: boosted ? 2.4 : 1.8,
                    map: sparkTexture,
                    color: palette[0],
                    transparent: true,
                    opacity: 0.98,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                fw.rocketMesh = new THREE.Points(rocketGeo, rocketMat);
                scene.add(fw.rocketMesh);
            } else {
                triggerFireworkBurst(fw);
            }

            fireworks.push(fw);
        }

        function triggerFireworkBurst(fw) {
            if (fw.rocketMesh) {
                scene.remove(fw.rocketMesh);
                fw.rocketMesh.geometry.dispose();
                fw.rocketMesh.material.dispose();
                fw.rocketMesh = null;
            }

            fw.phase = 'burst';
            fw.age = 0;

            const boosted = fw.boosted;
            const count = boosted ? 250 : 88;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = fw.x;
                positions[i * 3 + 1] = fw.y;
                positions[i * 3 + 2] = fw.z;

                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);

                let shellSpeed;
                if (boosted) {
                    // Triple-shell super chrysanthemum + outer ring
                    if (i < 55) {
                        shellSpeed = 6.0 + (Math.random() - 0.5) * 2.0;
                    } else if (i < 165) {
                        shellSpeed = 12.8 + (Math.random() - 0.5) * 2.4;
                    } else {
                        shellSpeed = 18.2 + (Math.random() - 0.5) * 2.8;
                    }
                } else {
                    // Dual-shell peony firework (inner core + outer crown)
                    shellSpeed = (i < 28 ? 5.2 : 10.5) + (Math.random() - 0.5) * 1.8;
                }

                velocities.push({
                    vx: Math.sin(phi) * Math.cos(theta) * shellSpeed,
                    vy: Math.cos(phi) * shellSpeed + (boosted ? 1.8 : 1.2),
                    vz: Math.sin(phi) * Math.sin(theta) * shellSpeed
                });

                const col = new THREE.Color(fw.palette[i % fw.palette.length]);
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: boosted ? 2.35 : 1.75,
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            fw.burstPoints = new THREE.Points(geo, mat);
            fw.velocities = velocities;
            scene.add(fw.burstPoints);

            // Flash museum front light with firework color
            if (fireworkLight && isNight) {
                fireworkLight.color.setHex(fw.palette[0]);
                fireworkLight.position.set(fw.x, fw.y, fw.z);
                fireworkLight.intensity = boosted ? 5.2 : 2.4;
                fireworkLight.distance = boosted ? 145 : 75;
            }
        }

        function updateMuseumFireworks(dt) {
            if (!isNight) return;

            fireworkTimer += dt;
            const interval = isFireworkBoost ? 0.16 : 0.68;
            const maxConcurrent = isFireworkBoost ? 16 : 4;

            if (fireworkTimer > interval) {
                fireworkTimer = 0;
                if (fireworks.length < maxConcurrent) {
                    launchMuseumFirework(false);
                    if (isFireworkBoost && Math.random() < 0.45 && fireworks.length < maxConcurrent) {
                        launchMuseumFirework(false);
                    }
                }
            }

            // Decay flash light smoothly
            if (fireworkLight && fireworkLight.intensity > 0.1) {
                fireworkLight.intensity *= Math.pow(0.18, dt);
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                if (fw.phase === 'ascend') {
                    fw.y += fw.vy * dt;
                    if (fw.rocketMesh) {
                        const posAttr = fw.rocketMesh.geometry.attributes.position;
                        for (let j = 0; j < 7; j++) {
                            posAttr.setXYZ(j, fw.x + (Math.random() - 0.5) * 0.2, fw.y - j * 0.6, fw.z + (Math.random() - 0.5) * 0.2);
                        }
                        posAttr.needsUpdate = true;
                    }
                    if (fw.y >= fw.targetY) {
                        triggerFireworkBurst(fw);
                    }
                } else if (fw.phase === 'burst') {
                    fw.age += dt;
                    const progress = fw.age / fw.maxLife;
                    if (progress >= 1.0) {
                        if (fw.burstPoints) {
                            scene.remove(fw.burstPoints);
                            fw.burstPoints.geometry.dispose();
                            fw.burstPoints.material.dispose();
                        }
                        fireworks.splice(i, 1);
                        continue;
                    }

                    const posAttr = fw.burstPoints.geometry.attributes.position;
                    const drag = Math.pow(0.32, dt);
                    const gravity = 5.5 * dt;

                    for (let j = 0; j < fw.velocities.length; j++) {
                        const vel = fw.velocities[j];
                        vel.vx *= drag;
                        vel.vz *= drag;
                        vel.vy = vel.vy * drag - gravity;

                        const px = posAttr.getX(j) + vel.vx * dt;
                        const py = posAttr.getY(j) + vel.vy * dt;
                        const pz = posAttr.getZ(j) + vel.vz * dt;
                        posAttr.setXYZ(j, px, py, pz);
                    }
                    posAttr.needsUpdate = true;

                    // Smooth sparkle fade out
                    const baseSize = fw.boosted ? 2.35 : 1.75;
                    fw.burstPoints.material.opacity = Math.max(0, 1.0 - Math.pow(progress, 1.4));
                    fw.burstPoints.material.size = baseSize * (1.0 - progress * 0.3);
                }
            }
        }

        function clearMuseumFireworks() {
            fireworks.forEach(fw => {
                if (fw.rocketMesh) {
                    scene.remove(fw.rocketMesh);
                    fw.rocketMesh.geometry.dispose();
                    fw.rocketMesh.material.dispose();
                }
                if (fw.burstPoints) {
                    scene.remove(fw.burstPoints);
                    fw.burstPoints.geometry.dispose();
                    fw.burstPoints.material.dispose();
                }
            });
            fireworks = [];
            if (fireworkLight) fireworkLight.intensity = 0;
        }

        function updateFireworkBoostButtonUI() {
            const boostBtn = document.getElementById('firework-boost-btn');
            const boostStatus = document.getElementById('firework-boost-status');
            if (!boostBtn || !boostStatus) return;

            if (isFireworkBoost) {
                boostBtn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-gradient-to-r from-pink-600 via-red-500 to-amber-500 text-white shadow-lg hover:brightness-110 active:scale-95 transition border border-amber-300';
                boostStatus.textContent = '強力ON!';
                boostStatus.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white text-red-600 ml-1 shadow-sm';
            } else {
                boostBtn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-slate-800/90 text-amber-300 shadow-md hover:bg-slate-900 active:scale-95 transition border border-amber-400/30';
                boostStatus.textContent = 'OFF';
                boostStatus.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/15 text-amber-200 ml-1';
            }
        }

        // ==========================================
        // 9. Day / Night Theme Switching
        // ==========================================
        function toggleTheme() {
            isNight = !isNight;
            const themeBtn = document.getElementById('theme-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');
            const topCard = document.getElementById('top-card');
            const detailPanel = document.getElementById('detail-panel');
            const searchResults = document.getElementById('search-results');

            if (isNight) {
                // Night Mode (Recreates Photo 1 + Apple Park glowing windows + Museum Fireworks)
                document.body.classList.replace('theme-day', 'theme-night');
                themeIcon.setAttribute('data-lucide', 'sun');
                if (themeLabel) themeLabel.textContent = '昼モードへ';
                themeBtn.classList.add('text-amber-400');
                themeBtn.classList.remove('text-gray-700');

                // Scene background & fog
                scene.background.setHex(PALETTE.night.bg);
                scene.fog.color.setHex(PALETTE.night.fog);

                // Ambient & Moon Lights
                ambientLight.intensity = 0.85;
                ambientLight.color.setHex(0x6b84ad);
                sunLight.intensity = 0.05;
                moonLight.intensity = 1.15;

                // Solid Materials
                dayMaterials.forEach(mat => {
                    mat.color.setHex(mat.userData.nightColor);
                    mat.roughness = mat.userData.nightRough;
                    mat.needsUpdate = true;
                });

                // Apple Park Glowing Window Materials (Warm luminous ribbon glow in dark mode)
                windowMaterials.forEach(mat => {
                    mat.color.setHex(mat.userData.nightColor);
                    mat.emissiveIntensity = mat.userData.nightEmissive;
                    mat.roughness = mat.userData.nightRough;
                    mat.needsUpdate = true;
                });

                // Glowing White Louver & Ground Base Trims
                glowTrimMaterials.forEach(mat => {
                    mat.emissiveIntensity = 0.92;
                    mat.needsUpdate = true;
                });

                // Window & Flood Lights ON
                windowLights.forEach(wl => wl.light.intensity = wl.nightIntensity);

                // Launch initial celebratory fireworks in front of Museum immediately
                launchMuseumFirework(true);
                setTimeout(() => { if (isNight) launchMuseumFirework(false); }, 250);

                // UI Glass Dark Mode
                topCard.classList.replace('glass-panel', 'glass-panel-dark');
                detailPanel.classList.replace('glass-panel', 'glass-panel-dark');
                searchResults.classList.replace('glass-panel', 'glass-panel-dark');
                document.getElementById('title-text').classList.replace('text-gray-900', 'text-white');
                const fovTitle = document.getElementById('fov-title');
                if (fovTitle) fovTitle.classList.replace('text-gray-700', 'text-gray-200');
                document.getElementById('detail-title').classList.replace('text-gray-900', 'text-white');
                document.getElementById('detail-desc').classList.replace('text-gray-600', 'text-gray-300');

                // POI labels dark background
                document.querySelectorAll('.poi-label').forEach(lbl => {
                    lbl.classList.replace('bg-white/95', 'bg-slate-900/90');
                    lbl.classList.replace('text-gray-800', 'text-white');
                });
            } else {
                // Day Mode (Recreates Photo 2 + Apple Park lit windows)
                document.body.classList.replace('theme-night', 'theme-day');
                themeIcon.setAttribute('data-lucide', 'moon');
                if (themeLabel) themeLabel.textContent = '夜モード';
                themeBtn.classList.remove('text-amber-400');
                themeBtn.classList.add('text-gray-700');

                scene.background.setHex(PALETTE.day.bg);
                scene.fog.color.setHex(PALETTE.day.fog);

                ambientLight.intensity = 0.72;
                ambientLight.color.setHex(0xffffff);
                sunLight.intensity = 1.15;
                moonLight.intensity = 0;

                dayMaterials.forEach(mat => {
                    mat.color.setHex(mat.userData.dayColor);
                    mat.roughness = mat.userData.dayRough;
                    mat.needsUpdate = true;
                });

                windowMaterials.forEach(mat => {
                    mat.color.setHex(mat.userData.dayColor);
                    mat.emissiveIntensity = mat.userData.dayEmissive;
                    mat.roughness = mat.userData.dayRough;
                    mat.needsUpdate = true;
                });

                glowTrimMaterials.forEach(mat => {
                    mat.emissiveIntensity = 0.35;
                    mat.needsUpdate = true;
                });

                // Window & Flood Lights OFF
                windowLights.forEach(wl => wl.light.intensity = 0);

                // Clear fireworks & reset boost in day mode
                clearMuseumFireworks();
                if (isFireworkBoost) {
                    isFireworkBoost = false;
                    updateFireworkBoostButtonUI();
                }

                // UI Glass Light Mode
                topCard.classList.replace('glass-panel-dark', 'glass-panel');
                detailPanel.classList.replace('glass-panel-dark', 'glass-panel');
                searchResults.classList.replace('glass-panel-dark', 'glass-panel');
                document.getElementById('title-text').classList.replace('text-white', 'text-gray-900');
                const fovTitle = document.getElementById('fov-title');
                if (fovTitle) fovTitle.classList.replace('text-gray-200', 'text-gray-700');
                document.getElementById('detail-title').classList.replace('text-white', 'text-gray-900');
                document.getElementById('detail-desc').classList.replace('text-gray-300', 'text-gray-600');

                // POI labels light background
                document.querySelectorAll('.poi-label').forEach(lbl => {
                    lbl.classList.replace('bg-slate-900/90', 'bg-white/95');
                    lbl.classList.replace('text-white', 'text-gray-800');
                });
            }

            lucide.createIcons();
        }

        // ==========================================
        // 10. UI Setup & Interactions
        // ==========================================
        function setupUI() {
            // Theme toggle
            document.getElementById('theme-btn').addEventListener('click', toggleTheme);

            // Facility Navigation visibility toggle (with ON/OFF badge & detail card suppression)
            document.getElementById('labels-btn').addEventListener('click', () => {
                showLabels = !showLabels;
                const btn = document.getElementById('labels-btn');
                const statusBadge = document.getElementById('labels-status');

                if (showLabels) {
                    btn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-blue-600 text-white shadow-md hover:bg-blue-700 active:scale-95 transition border border-blue-400/40';
                    if (statusBadge) {
                        statusBadge.textContent = 'ON';
                        statusBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/25 text-white ml-1';
                    }
                } else {
                    btn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-gray-500/20 text-gray-500 shadow-inner hover:bg-gray-500/30 active:scale-95 transition border border-gray-400/30';
                    if (statusBadge) {
                        statusBadge.textContent = 'OFF';
                        statusBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-gray-500/30 text-gray-500 ml-1';
                    }
                    // Hide facility explanation immediately when turned OFF
                    hideDetailCard();
                }
            });

            // Powerful Fireworks Boost toggle button
            document.getElementById('firework-boost-btn').addEventListener('click', () => {
                isFireworkBoost = !isFireworkBoost;

                // Automatically switch to Night Mode if activated during Day Mode
                if (isFireworkBoost && !isNight) {
                    toggleTheme();
                }

                updateFireworkBoostButtonUI();

                if (isFireworkBoost) {
                    // Launch an immediate multi-shot starmine salvo in front of Kansai University Museum
                    launchMuseumFirework(true, true);
                    launchMuseumFirework(true, true);
                    for (let k = 1; k <= 5; k++) {
                        setTimeout(() => {
                            if (isNight && isFireworkBoost) {
                                launchMuseumFirework(k <= 2, true);
                            }
                        }, k * 110);
                    }
                }
            });

            // Compass reset
            const compassBtn = document.getElementById('compass-btn');
            compassBtn.addEventListener('click', () => {
                animateCamera([0, 175, 240], [0, 5, 0]);
            });

            // 2D / 3D Toggle
            const dimBtn = document.getElementById('dim-btn');
            dimBtn.addEventListener('click', () => {
                is3D = !is3D;
                dimBtn.textContent = is3D ? '3D' : '2D';
                if (!is3D) {
                    animateCamera([0, 260, 1], [0, 0, 0]);
                } else {
                    animateCamera([0, 185, 250], [0, 5, 0]);
                }
            });

            // Field of View (FOV / Wide Angle) Slider & Preset Controls
            const fovSlider = document.getElementById('fov-slider');
            const fovValue = document.getElementById('fov-value');
            const fovPresetBtn = document.getElementById('fov-preset-btn');
            const wideBtn = document.getElementById('wide-btn');

            const applyFov = (newFov, smooth = false) => {
                const clamped = Math.max(30, Math.min(85, Math.round(newFov)));
                if (fovSlider) fovSlider.value = clamped;
                let prefix = '標準';
                if (clamped >= 68) prefix = '超広角';
                else if (clamped >= 48) prefix = '広角';
                if (fovValue) fovValue.textContent = `${prefix} ${clamped}°`;

                if (smooth) {
                    new TWEEN.Tween(camera)
                        .to({ fov: clamped }, 350)
                        .easing(TWEEN.Easing.Quadratic.Out)
                        .onUpdate(() => camera.updateProjectionMatrix())
                        .start();
                } else {
                    camera.fov = clamped;
                    camera.updateProjectionMatrix();
                }
            };

            if (fovSlider) {
                fovSlider.addEventListener('input', (e) => {
                    applyFov(Number(e.target.value), false);
                });
            }

            const cycleFovPreset = () => {
                const cur = Math.round(camera.fov);
                // Cycle: 55° (広角) -> 75° (超広角パノラマ) -> 38° (標準) -> 55°
                if (cur < 48) applyFov(55, true);
                else if (cur < 68) applyFov(75, true);
                else applyFov(38, true);
            };

            if (fovPresetBtn) fovPresetBtn.addEventListener('click', cycleFovPreset);
            if (wideBtn) wideBtn.addEventListener('click', cycleFovPreset);

            // Zoom In / Out
            document.getElementById('zoom-in-btn').addEventListener('click', () => {
                const dir = camera.position.clone().sub(controls.target).normalize();
                new TWEEN.Tween(camera.position)
                    .to(camera.position.clone().sub(dir.multiplyScalar(35)), 300)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
            });
            document.getElementById('zoom-out-btn').addEventListener('click', () => {
                const dir = camera.position.clone().sub(controls.target).normalize();
                new TWEEN.Tween(camera.position)
                    .to(camera.position.clone().add(dir.multiplyScalar(35)), 300)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
            });

            // Home Full View
            document.getElementById('home-btn').addEventListener('click', () => {
                animateCamera([0, 175, 240], [0, 5, 0]);
                hideDetailCard();
            });

            // Detail Card Close
            document.getElementById('close-detail-btn').addEventListener('click', hideDetailCard);
            document.getElementById('detail-zoom-btn').addEventListener('click', () => {
                if (selectedPoiId) focusOnPoi(selectedPoiId);
            });

            // Quick Category Pills
            document.querySelectorAll('.quick-pill').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.quick-pill').forEach(p => p.classList.remove('active', 'border-blue-500'));
                    btn.classList.add('active', 'border-blue-500');

                    const focusKey = btn.dataset.focus;
                    if (focusKey === 'all') {
                        animateCamera([0, 175, 240], [0, 5, 0]);
                        hideDetailCard();
                    } else if (focusKey === 'gate') {
                        focusOnPoi('main-gate');
                    } else if (focusKey === 'library') {
                        focusOnPoi('library');
                    } else if (focusKey === 'museum') {
                        focusOnPoi('museum');
                    } else if (focusKey === 'symphony') {
                        focusOnPoi('symphony');
                    } else if (focusKey === 'bldg4') {
                        focusOnPoi('bldg4');
                    } else if (focusKey === 'sports') {
                        focusOnPoi('ground-central');
                    } else if (focusKey === 'circolo') {
                        focusOnPoi('circolo');
                    }
                });
            });

            // Search Bar Functionality
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const clearBtn = document.getElementById('clear-search-btn');

            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (!q) {
                    searchResults.classList.add('hidden');
                    clearBtn.classList.add('hidden');
                    return;
                }
                clearBtn.classList.remove('hidden');

                const allItems = [...TENT_AND_BIN_DATA, ...POI_DATA];
                const matches = allItems.filter(p =>
                    (p.tentNo && p.tentNo.toLowerCase().includes(q)) ||
                    p.name.toLowerCase().includes(q) ||
                    p.nameEn.toLowerCase().includes(q) ||
                    p.category.toLowerCase().includes(q) ||
                    p.desc.toLowerCase().includes(q)
                ).sort((a, b) => {
                    const aExact = a.tentNo && a.tentNo.toLowerCase() === q ? 0 : (a.tentNo && a.tentNo.toLowerCase().startsWith(q) ? 1 : 2);
                    const bExact = b.tentNo && b.tentNo.toLowerCase() === q ? 0 : (b.tentNo && b.tentNo.toLowerCase().startsWith(q) ? 1 : 2);
                    return aExact - bExact;
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = `<div class="p-3 text-center text-gray-400">見つかりませんでした</div>`;
                } else {
                    searchResults.innerHTML = matches.map(p => `
                        <div class="search-item flex items-center space-x-2.5 p-2 rounded-xl hover:bg-black/5 cursor-pointer transition" data-id="${p.id}">
                            <div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-black flex-shrink-0" style="background-color: ${p.color};">
                                ${p.tentNo ? `<span>${p.tentNo.slice(0, 3)}</span>` : `<i data-lucide="${p.icon}" class="w-3.5 h-3.5"></i>`}
                            </div>
                            <div class="truncate">
                                <div class="font-bold text-gray-800 text-xs truncate">${p.name}</div>
                                <div class="text-[10px] text-gray-400">${p.category}</div>
                            </div>
                        </div>
                    `).join('');
                }

                lucide.createIcons();
                searchResults.classList.remove('hidden');

                searchResults.querySelectorAll('.search-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        focusOnPoi(id);
                        searchResults.classList.add('hidden');
                        searchInput.value = '';
                        clearBtn.classList.add('hidden');
                    });
                });
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.classList.add('hidden');
                clearBtn.classList.add('hidden');
            });

            lucide.createIcons();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 11. Animation Loop
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            // 1. Update Tween
            TWEEN.update();

            // 2. Update OrbitControls
            controls.update();

            // 3. Expressway Cars Traffic Animation
            cars.forEach(car => {
                car.mesh.position.x += car.speed;
                if (car.isEastbound && car.mesh.position.x > 145) {
                    car.mesh.position.x = -160;
                } else if (!car.isEastbound && car.mesh.position.x < -160) {
                    car.mesh.position.x = 145;
                }
            });

            // 3.5 Update Museum Fireworks in Dark Mode
            updateMuseumFireworks(dt);

            // 4. Update Compass needle rotation based on camera angle
            const compassArrow = document.getElementById('compass-arrow');
            if (compassArrow) {
                const angle = controls.getAzimuthalAngle();
                compassArrow.style.transform = `rotate(${angle}rad)`;
            }

            // 5. Update POI Screen Positions
            updatePoiPositions();

            // 6. Render 3D Scene
            renderer.render(scene, camera);
        }

        // Initialize when window loads
        window.addEventListener('load', init);
    </script>
