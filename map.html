        // ==========================================
        // 9. Starry Sky System & Day / Night Theme Transition
        // ==========================================
        const COLOR_DAY_BG = new THREE.Color(PALETTE.day.bg);
        const COLOR_DUSK_BG = new THREE.Color(0x3a4d72); // Warm twilight indigo dusk
        const COLOR_NIGHT_BG = new THREE.Color(0x090f1d); // Deep starry night cosmos
        const COLOR_DAY_AMB = new THREE.Color(0xffffff);
        const COLOR_DUSK_AMB = new THREE.Color(0xc8b5d8);
        const COLOR_NIGHT_AMB = new THREE.Color(0x6b84ad);
        const COLOR_DAY_SUN = new THREE.Color(0xfff6e8);
        const COLOR_DUSK_SUN = new THREE.Color(0xff9e5e);
        const TEMP_COLOR = new THREE.Color();

        function smoothstep(edge0, edge1, x) {
            const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
            return t * t * (3 - 2 * t);
        }

        let skyOverlayCleared = true;
        function resizeSkyOverlay() {
            if (!skyOverlayCanvas) return;
            // Use 1x resolution for atmospheric sky overlay canvas to cut 2D fillrate by ~65% while keeping silky gradients
            skyOverlayCanvas.width = window.innerWidth;
            skyOverlayCanvas.height = window.innerHeight;
            skyOverlayCleared = false;
        }

        function setupStarrySky() {
            if (!sparkTexture) sparkTexture = createSparkTexture();
            if (!starSparkleTexture) starSparkleTexture = createStarSparkleTexture();

            // ---------------------------------------------------------
            // A. 3D Starry Sky Dome & Milky Way (Centered on Camera)
            // ---------------------------------------------------------
            skyDomeGroup = new THREE.Group();
            skyDomeGroup.visible = false;
            scene.add(skyDomeGroup);

            // 1. Deep Cosmic Gradient Sky Dome Sphere
            const domeGeo = new THREE.SphereGeometry(1180, 32, 24);
            const posAttr = domeGeo.attributes.position;
            const domeColors = new Float32Array(posAttr.count * 3);
            const zenithCol = new THREE.Color(0x030611);
            const midSkyCol = new THREE.Color(0x091226);
            const horizonCol = new THREE.Color(0x14223d);
            const nadirCol = new THREE.Color(0x080e1c);
            const cTmp = new THREE.Color();

            for (let i = 0; i < posAttr.count; i++) {
                const ny = posAttr.getY(i) / 1180; // -1 to +1
                if (ny >= 0.15) {
                    const t = Math.min(1, (ny - 0.15) / 0.85);
                    cTmp.lerpColors(midSkyCol, zenithCol, Math.pow(t, 0.75));
                } else if (ny >= -0.38) {
                    const t = (ny + 0.38) / 0.53;
                    cTmp.lerpColors(horizonCol, midSkyCol, t);
                } else {
                    const t = Math.min(1, (-0.38 - ny) / 0.62);
                    cTmp.lerpColors(horizonCol, nadirCol, t);
                }
                domeColors[i * 3] = cTmp.r;
                domeColors[i * 3 + 1] = cTmp.g;
                domeColors[i * 3 + 2] = cTmp.b;
            }
            domeGeo.setAttribute('color', new THREE.BufferAttribute(domeColors, 3));

            skyDomeMat = new THREE.MeshBasicMaterial({
                vertexColors: true,
                side: THREE.BackSide,
                transparent: true,
                opacity: 0,
                depthTest: true,
                depthWrite: false,
                fog: false
            });
            const skyDomeMesh = new THREE.Mesh(domeGeo, skyDomeMat);
            skyDomeMesh.renderOrder = -100;
            skyDomeGroup.add(skyDomeMesh);

            const starPalette = [
                new THREE.Color(0xffffff), // Pure white
                new THREE.Color(0xdbeafe), // Sirius ice blue
                new THREE.Color(0xbae6fd), // Vega cyan-white
                new THREE.Color(0xfef3c7), // Capella warm champagne
                new THREE.Color(0xfde68a), // Arcturus pale gold
                new THREE.Color(0xf5d0fe)  // Soft celestial lavender
            ];

            // Helper to sample directions on the sky dome with rich concentration along the visible horizon & upper sky
            const sampleSkyDirection = (horizonBias = false) => {
                const theta = Math.random() * Math.PI * 2;
                let ny;
                if (horizonBias && Math.random() < 0.72) {
                    // Dense band visible right above the campus & Meishin Expressway (-0.42 to +0.45)
                    ny = -0.42 + Math.pow(Math.random(), 1.15) * 0.87;
                } else {
                    ny = -0.44 + Math.random() * 1.44;
                }
                const rProj = Math.sqrt(Math.max(0.001, 1 - ny * ny));
                return {
                    x: rProj * Math.cos(theta),
                    y: ny,
                    z: rProj * Math.sin(theta)
                };
            };

            // 2. Milky Way Stardust Band & Soft Nebula Glow Clouds
            const mwCount = IS_MOBILE ? 750 : 1450;
            const mwGeo = new THREE.BufferGeometry();
            const mwPos = new Float32Array(mwCount * 3);
            const mwCol = new Float32Array(mwCount * 3);
            const mwRadius = 1120;

            for (let i = 0; i < mwCount; i++) {
                // Diagonal galactic plane tilted across the northern/upper sky
                const along = (Math.random() - 0.5) * Math.PI * 2;
                const spread = (Math.random() + Math.random() + Math.random() - 1.5) * 0.24;
                let dx = Math.cos(along);
                let dy = 0.08 + Math.sin(along) * 0.45 + spread * 0.85;
                let dz = -Math.abs(Math.sin(along)) * 0.88 + spread;
                const len = Math.hypot(dx, dy, dz) || 1;
                dx /= len; dy /= len; dz /= len;
                if (dy < -0.43) dy = -0.43 + Math.random() * 0.35;

                mwPos[i * 3] = dx * mwRadius;
                mwPos[i * 3 + 1] = dy * mwRadius;
                mwPos[i * 3 + 2] = dz * mwRadius;

                const col = starPalette[i % starPalette.length];
                const brightness = 0.55 + Math.random() * 0.45;
                mwCol[i * 3] = col.r * brightness;
                mwCol[i * 3 + 1] = col.g * brightness;
                mwCol[i * 3 + 2] = col.b * brightness;
            }
            mwGeo.setAttribute('position', new THREE.BufferAttribute(mwPos, 3));
            mwGeo.setAttribute('color', new THREE.BufferAttribute(mwCol, 3));
            milkyWayMat = new THREE.PointsMaterial({
                size: IS_MOBILE ? 2.6 : 2.2,
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            });
            const milkyWayPoints = new THREE.Points(mwGeo, milkyWayMat);
            milkyWayPoints.renderOrder = -98;
            skyDomeGroup.add(milkyWayPoints);

            // Soft Nebula Clouds along Milky Way
            const nebCount = IS_MOBILE ? 28 : 48;
            const nebGeo = new THREE.BufferGeometry();
            const nebPos = new Float32Array(nebCount * 3);
            const nebCol = new Float32Array(nebCount * 3);
            const nebColors = [new THREE.Color(0x38bdf8), new THREE.Color(0x818cf8), new THREE.Color(0xc084fc), new THREE.Color(0x60a5fa)];
            for (let i = 0; i < nebCount; i++) {
                const angle = (i / nebCount) * Math.PI * 2;
                const spread = (Math.random() - 0.5) * 0.18;
                let dx = Math.cos(angle);
                let dy = -0.12 + Math.sin(angle) * 0.38 + spread;
                let dz = -0.55 + Math.sin(angle * 0.7) * 0.45;
                const len = Math.hypot(dx, dy, dz) || 1;
                nebPos[i * 3] = (dx / len) * 1130;
                nebPos[i * 3 + 1] = Math.max(-0.36, dy / len) * 1130;
                nebPos[i * 3 + 2] = (dz / len) * 1130;
                const nc = nebColors[i % nebColors.length];
                nebCol[i * 3] = nc.r;
                nebCol[i * 3 + 1] = nc.g;
                nebCol[i * 3 + 2] = nc.b;
            }
            nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
            nebGeo.setAttribute('color', new THREE.BufferAttribute(nebCol, 3));
            nebulaMat = new THREE.PointsMaterial({
                size: IS_MOBILE ? 52 : 68,
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            });
            const nebulaPoints = new THREE.Points(nebGeo, nebulaMat);
            nebulaPoints.renderOrder = -99;
            skyDomeGroup.add(nebulaPoints);

            // 3. Three Twinkling Star Groups (Different frequencies & sizes for natural stellar scintillation)
            const groupConfigs = [
                { count: IS_MOBILE ? 220 : 380, baseSize: IS_MOBILE ? 3.4 : 3.0, speed: 1.8, phase: 0.0 },
                { count: IS_MOBILE ? 180 : 320, baseSize: IS_MOBILE ? 4.4 : 3.9, speed: 2.7, phase: 2.1 },
                { count: IS_MOBILE ? 140 : 250, baseSize: IS_MOBILE ? 5.2 : 4.7, speed: 3.6, phase: 4.3 }
            ];
            starGroupMats = [];

            groupConfigs.forEach(cfg => {
                const sGeo = new THREE.BufferGeometry();
                const sPos = new Float32Array(cfg.count * 3);
                const sCol = new Float32Array(cfg.count * 3);
                const radius = 1090;

                for (let i = 0; i < cfg.count; i++) {
                    const dir = sampleSkyDirection(true);
                    sPos[i * 3] = dir.x * radius;
                    sPos[i * 3 + 1] = dir.y * radius;
                    sPos[i * 3 + 2] = dir.z * radius;

                    const col = starPalette[Math.floor(Math.random() * starPalette.length)];
                    const lum = 0.72 + Math.random() * 0.28;
                    sCol[i * 3] = col.r * lum;
                    sCol[i * 3 + 1] = col.g * lum;
                    sCol[i * 3 + 2] = col.b * lum;
                }
                sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
                sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));

                const sMat = new THREE.PointsMaterial({
                    size: cfg.baseSize,
                    map: sparkTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0,
                    depthTest: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    fog: false
                });
                sMat.userData = { baseSize: cfg.baseSize, speed: cfg.speed, phase: cfg.phase };
                starGroupMats.push(sMat);

                const sPoints = new THREE.Points(sGeo, sMat);
                sPoints.renderOrder = -96;
                skyDomeGroup.add(sPoints);
            });

            // 4. First-Magnitude Cross-Sparkle Stars (一番星・一等星: emerge early during twilight fade-out)
            const brightCount = IS_MOBILE ? 60 : 105;
            const bGeo = new THREE.BufferGeometry();
            const bPos = new Float32Array(brightCount * 3);
            const bCol = new Float32Array(brightCount * 3);
            const bRadius = 1065;

            for (let i = 0; i < brightCount; i++) {
                const dir = sampleSkyDirection(true);
                bPos[i * 3] = dir.x * bRadius;
                bPos[i * 3 + 1] = dir.y * bRadius;
                bPos[i * 3 + 2] = dir.z * bRadius;

                const col = starPalette[i % starPalette.length];
                bCol[i * 3] = col.r;
                bCol[i * 3 + 1] = col.g;
                bCol[i * 3 + 2] = col.b;
            }
            bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
            bGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));

            brightStarMat = new THREE.PointsMaterial({
                size: IS_MOBILE ? 10.5 : 9.5,
                map: starSparkleTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            });
            const brightPoints = new THREE.Points(bGeo, brightStarMat);
            brightPoints.renderOrder = -95;
            skyDomeGroup.add(brightPoints);

            // ---------------------------------------------------------
            // B. 2D Atmospheric Starry Sky & Twilight Transition Overlay
            // ---------------------------------------------------------
            skyOverlayCanvas = document.getElementById('sky-transition-canvas');
            if (skyOverlayCanvas) {
                skyOverlayCtx = skyOverlayCanvas.getContext('2d');
                resizeSkyOverlay();

                const overlayCount = IS_MOBILE ? 95 : 165;
                const cssColors = ['#ffffff', '#e0f2fe', '#bae6fd', '#fef3c7', '#fde68a', '#f5d0fe'];
                overlayStars = [];
                for (let i = 0; i < overlayCount; i++) {
                    // Concentrated in the upper sky & horizon band (yNorm 0.0 to 0.48), with some full-screen transition stars
                    const isTransitionFull = i >= overlayCount * 0.72;
                    const yNorm = isTransitionFull
                        ? (0.15 + Math.random() * 0.72)
                        : (Math.pow(Math.random(), 1.35) * 0.42);
                    overlayStars.push({
                        xNorm: Math.random(),
                        yNorm,
                        isTransitionFull,
                        radius: (Math.random() < 0.16 ? 1.85 : 0.85) + Math.random() * 0.9,
                        isSparkle: Math.random() < 0.14,
                        color: cssColors[i % cssColors.length],
                        twinkleSpeed: 1.5 + Math.random() * 3.2,
                        twinklePhase: Math.random() * Math.PI * 2,
                        threshold: 0.18 + Math.random() * 0.55 // Staggered appearance as day fades out
                    });
                }
            }
        }

        function spawn3DShootingStar() {
            if (!skyDomeGroup || !sparkTexture) return;
            const radius = 1020;
            const theta = -Math.PI * 0.85 + Math.random() * Math.PI * 1.7;
            const startY = -0.05 + Math.random() * 0.42;
            const rProj = Math.sqrt(Math.max(0.1, 1 - startY * startY));

            const sx = rProj * Math.cos(theta) * radius;
            const sy = startY * radius;
            const sz = rProj * Math.sin(theta) * radius;

            // Tangent direction across the sky dome with downward inclination
            const dirSign = Math.random() < 0.5 ? 1 : -1;
            const vx = (-Math.sin(theta) * dirSign * 420) + (Math.random() - 0.5) * 80;
            const vy = -(110 + Math.random() * 95);
            const vz = (Math.cos(theta) * dirSign * 420) + (Math.random() - 0.5) * 80;

            const trailLen = 12;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(trailLen * 3);
            const colors = new Float32Array(trailLen * 3);
            for (let i = 0; i < trailLen; i++) {
                positions[i * 3] = sx;
                positions[i * 3 + 1] = sy;
                positions[i * 3 + 2] = sz;
                const fade = Math.pow(1 - i / (trailLen - 1), 1.5);
                colors[i * 3] = 0.88 * fade + 0.12;
                colors[i * 3 + 1] = 0.95 * fade + 0.05;
                colors[i * 3 + 2] = 1.0 * fade;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: IS_MOBILE ? 4.2 : 3.6,
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                opacity: 0.95,
                depthTest: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            });
            const points = new THREE.Points(geo, mat);
            points.renderOrder = -92;
            skyDomeGroup.add(points);

            shootingStars3D.push({
                points,
                x: sx,
                y: sy,
                z: sz,
                vx,
                vy,
                vz,
                age: 0,
                maxLife: 0.75 + Math.random() * 0.35,
                trailLen
            });
        }

        function spawnOverlayShootingStar() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const fromLeft = Math.random() < 0.55;
            overlayShootingStars.push({
                x: (0.15 + Math.random() * 0.7) * w,
                y: (0.04 + Math.random() * 0.24) * h,
                vx: (fromLeft ? 1 : -1) * (360 + Math.random() * 220),
                vy: 120 + Math.random() * 90,
                length: 65 + Math.random() * 45,
                age: 0,
                maxLife: 0.65 + Math.random() * 0.3
            });
        }

        let overlayFrameCounter = 0;
        function updateStarrySky(dt, elapsedTime) {
            if (nightProgress <= 0.001) {
                if (skyDomeGroup && skyDomeGroup.visible) skyDomeGroup.visible = false;
                if (!skyOverlayCleared && skyOverlayCtx && skyOverlayCanvas) {
                    skyOverlayCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                    skyOverlayCleared = true;
                }
                return;
            }
            skyOverlayCleared = false;

            // 1. Update 3D Sky Dome & Twinkling Star Layers
            if (skyDomeGroup) {
                skyDomeGroup.visible = true;
                skyDomeGroup.position.copy(camera.position);
                // Subtle celestial rotation
                skyDomeGroup.rotation.y = elapsedTime * 0.006;

                const starAlpha = smoothstep(0.22, 0.96, nightProgress);
                const earlyStarAlpha = smoothstep(0.14, 0.78, nightProgress); // Evening stars (一番星) appear first!

                if (skyDomeMat) {
                    skyDomeMat.opacity = smoothstep(0.08, 0.88, nightProgress);
                }
                if (milkyWayMat) {
                    milkyWayMat.opacity = smoothstep(0.45, 1.0, nightProgress) * 0.78;
                }
                if (nebulaMat) {
                    nebulaMat.opacity = smoothstep(0.5, 1.0, nightProgress) * 0.065;
                }
                if (brightStarMat) {
                    const pulse = 0.88 + 0.12 * Math.sin(elapsedTime * 2.2);
                    brightStarMat.opacity = earlyStarAlpha * pulse;
                    brightStarMat.size = (IS_MOBILE ? 10.5 : 9.5) * (0.92 + 0.12 * Math.sin(elapsedTime * 1.7));
                }

                for (let i = 0; i < starGroupMats.length; i++) {
                    const sm = starGroupMats[i];
                    const ud = sm.userData;
                    const wave = 0.72 + 0.28 * Math.sin(elapsedTime * ud.speed + ud.phase);
                    sm.opacity = starAlpha * wave;
                    sm.size = ud.baseSize * (0.9 + 0.14 * Math.cos(elapsedTime * (ud.speed * 0.8) + ud.phase));
                }

                // Update 3D Shooting Stars
                if (nightProgress > 0.55) {
                    shootingStarTimer += dt;
                    if (shootingStarTimer > 3.6) {
                        shootingStarTimer = 0;
                        if (Math.random() < 0.75) spawn3DShootingStar();
                        if (Math.random() < 0.55) spawnOverlayShootingStar();
                    }
                }

                for (let i = shootingStars3D.length - 1; i >= 0; i--) {
                    const ss = shootingStars3D[i];
                    ss.age += dt;
                    const p = ss.age / ss.maxLife;
                    if (p >= 1) {
                        skyDomeGroup.remove(ss.points);
                        ss.points.geometry.dispose();
                        ss.points.material.dispose();
                        shootingStars3D.splice(i, 1);
                        continue;
                    }
                    ss.x += ss.vx * dt;
                    ss.y += ss.vy * dt;
                    ss.z += ss.vz * dt;

                    const posAttr = ss.points.geometry.attributes.position;
                    for (let j = 0; j < ss.trailLen; j++) {
                        const lag = j * 0.014;
                        posAttr.setXYZ(
                            j,
                            ss.x - ss.vx * lag,
                            ss.y - ss.vy * lag,
                            ss.z - ss.vz * lag
                        );
                    }
                    posAttr.needsUpdate = true;
                    ss.points.material.opacity = Math.sin(p * Math.PI) * nightProgress;
                }
            }

            // 2. Render 2D Twilight Fade & Upper-Sky Starfield Canopy Overlay
            if (skyOverlayCtx && skyOverlayCanvas) {
                const isTransitioning = nightProgress > 0.01 && nightProgress < 0.995;
                overlayFrameCounter++;
                // In steady night mode without active 2D shooting stars or camera movement, throttle 2D overlay redraw to every 2nd frame
                if (!isTransitioning && overlayShootingStars.length === 0 && !poiDirty && (overlayFrameCounter & 1) === 1) {
                    return;
                }

                const w = window.innerWidth;
                const h = window.innerHeight;
                skyOverlayCtx.clearRect(0, 0, w, h);

                const transitionBell = Math.sin(nightProgress * Math.PI); // Peaks at p = 0.5

                // Upper sky canopy height expands during transition or in 2D view, settles to upper sky in steady 3D Night Mode
                const polar = controls ? controls.getPolarAngle() : 1.0;
                const azimuth = controls ? controls.getAzimuthalAngle() : 0.0;
                const canopyRatio = isTransitioning
                    ? (0.42 + transitionBell * 0.45)
                    : (is3D ? 0.36 : 0.28);

                // Soft deep-cosmos upper sky gradient + twilight sunset horizon tint during transition
                const skyGrad = skyOverlayCtx.createLinearGradient(0, 0, 0, h * canopyRatio);
                const topAlpha = smoothstep(0.15, 0.95, nightProgress) * (isTransitioning ? 0.72 : 0.52);
                skyGrad.addColorStop(0, `rgba(4, 8, 22, ${topAlpha.toFixed(3)})`);
                skyGrad.addColorStop(0.52, `rgba(10, 19, 40, ${(topAlpha * 0.55).toFixed(3)})`);
                if (isTransitioning && transitionDirection >= 0) {
                    const duskGlow = (transitionBell * 0.28).toFixed(3);
                    skyGrad.addColorStop(0.82, `rgba(88, 68, 125, ${duskGlow})`);
                }
                skyGrad.addColorStop(1, 'rgba(10, 19, 40, 0)');
                skyOverlayCtx.fillStyle = skyGrad;
                skyOverlayCtx.fillRect(0, 0, w, h * canopyRatio);

                // Camera-parallaxed twinkling stars across the upper sky & transition veil (zero save/restore overhead)
                const panX = -azimuth / (Math.PI * 2);
                const panY = (polar - 0.95) * 0.08;
                skyOverlayCtx.lineWidth = 0.85;

                for (let i = 0; i < overlayStars.length; i++) {
                    const st = overlayStars[i];
                    if (st.isTransitionFull && !isTransitioning) continue;

                    const reveal = smoothstep(st.threshold, Math.min(1.0, st.threshold + 0.35), nightProgress);
                    if (reveal <= 0.01) continue;

                    const sx = (((st.xNorm + panX) % 1 + 1) % 1) * w;
                    const sy = Math.max(4, (st.yNorm + panY) * h);

                    const verticalFade = st.isTransitionFull
                        ? (transitionBell * (1 - st.yNorm * 0.65))
                        : Math.max(0, 1 - (sy / (h * canopyRatio)));
                    if (verticalFade <= 0.02) continue;

                    const twinkle = 0.62 + 0.38 * Math.sin(elapsedTime * st.twinkleSpeed + st.twinklePhase);
                    const alpha = Math.min(1, reveal * verticalFade * twinkle * (st.isTransitionFull ? 0.85 : 0.95));
                    if (alpha <= 0.02) continue;

                    skyOverlayCtx.globalAlpha = alpha;
                    skyOverlayCtx.fillStyle = st.color;
                    skyOverlayCtx.beginPath();
                    skyOverlayCtx.arc(sx, sy, st.radius, 0, Math.PI * 2);
                    skyOverlayCtx.fill();

                    // Delicate 4-point star flare on bright stars
                    if (st.isSparkle && alpha > 0.25) {
                        const spikeLen = st.radius * (3.2 + 0.8 * twinkle);
                        skyOverlayCtx.strokeStyle = st.color;
                        skyOverlayCtx.beginPath();
                        skyOverlayCtx.moveTo(sx - spikeLen, sy);
                        skyOverlayCtx.lineTo(sx + spikeLen, sy);
                        skyOverlayCtx.moveTo(sx, sy - spikeLen);
                        skyOverlayCtx.lineTo(sx, sy + spikeLen);
                        skyOverlayCtx.stroke();
                    }
                }
                skyOverlayCtx.globalAlpha = 1.0;

                // Render 2D Shooting Stars
                for (let i = overlayShootingStars.length - 1; i >= 0; i--) {
                    const ms = overlayShootingStars[i];
                    ms.age += dt;
                    const p = ms.age / ms.maxLife;
                    if (p >= 1) {
                        overlayShootingStars.splice(i, 1);
                        continue;
                    }
                    ms.x += ms.vx * dt;
                    ms.y += ms.vy * dt;

                    const norm = Math.hypot(ms.vx, ms.vy) || 1;
                    const tx = ms.x - (ms.vx / norm) * ms.length;
                    const ty = ms.y - (ms.vy / norm) * ms.length;
                    const alpha = Math.sin(p * Math.PI) * Math.min(1, nightProgress * 1.2);

                    const grad = skyOverlayCtx.createLinearGradient(ms.x, ms.y, tx, ty);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${alpha.toFixed(3)})`);
                    grad.addColorStop(0.35, `rgba(186, 230, 253, ${(alpha * 0.65).toFixed(3)})`);
                    grad.addColorStop(1, 'rgba(186, 230, 253, 0)');

                    skyOverlayCtx.strokeStyle = grad;
                    skyOverlayCtx.lineWidth = 2.0;
                    skyOverlayCtx.lineCap = 'round';
                    skyOverlayCtx.beginPath();
                    skyOverlayCtx.moveTo(ms.x, ms.y);
                    skyOverlayCtx.lineTo(tx, ty);
                    skyOverlayCtx.stroke();

                    // Glowing meteor head
                    skyOverlayCtx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
                    skyOverlayCtx.beginPath();
                    skyOverlayCtx.arc(ms.x, ms.y, 2.2, 0, Math.PI * 2);
                    skyOverlayCtx.fill();
                }
            }
        }

        // Smoothly interpolates all 3D scene colors, lights, materials, horizon fade, and starry sky for p in [0, 1]
        function applyThemeProgress(p) {
            nightProgress = p;

            // 1. Multi-stage Sky & Fog Color Interpolation (Day -> Twilight Dusk -> Deep Starry Night)
            if (p < 0.45) {
                const t = p / 0.45;
                scene.background.lerpColors(COLOR_DAY_BG, COLOR_DUSK_BG, t);
            } else {
                const t = (p - 0.45) / 0.55;
                scene.background.lerpColors(COLOR_DUSK_BG, COLOR_NIGHT_BG, t);
            }
            scene.fog.color.copy(scene.background);
            // Reduce fog density at night so stars and illuminated campus buildings shine crisply
            scene.fog.density = 0.00055 * (1 - p * 0.48);

            // 2. Sunlight Fade-Out (warms to sunset amber then dims out) & Moonlight Fade-In
            const sunFade = Math.pow(1 - p, 1.45);
            sunLight.intensity = 1.15 * sunFade + 0.04 * p;
            if (p < 0.5) {
                sunLight.color.lerpColors(COLOR_DAY_SUN, COLOR_DUSK_SUN, p / 0.5);
            } else {
                sunLight.color.copy(COLOR_DUSK_SUN);
            }

            moonLight.intensity = 1.15 * smoothstep(0.22, 1.0, p);

            // Ambient light dips slightly during dusk for rich twilight contrast, then settles to night slate
            const duskDip = Math.sin(p * Math.PI) * 0.14;
            ambientLight.intensity = (0.72 + (0.85 - 0.72) * p) - duskDip;
            if (p < 0.45) {
                ambientLight.color.lerpColors(COLOR_DAY_AMB, COLOR_DUSK_AMB, p / 0.45);
            } else {
                ambientLight.color.lerpColors(COLOR_DUSK_AMB, COLOR_NIGHT_AMB, (p - 0.45) / 0.55);
            }

            // 3. Outer Daytime Ground Fade-Out (Fades out daytime horizon to reveal the 3D Starry Sky around campus)
            if (dayOuterGround) {
                const outerAlpha = Math.pow(Math.max(0, 1 - p * 1.22), 1.65);
                dayOuterGround.material.opacity = outerAlpha;
                dayOuterGround.visible = outerAlpha > 0.004;
            }
            if (cityGround) {
                cityGround.material.opacity = 1.0 - p * 0.35;
            }

            // 4. Campus Solid Materials Smooth Color & Roughness Lerp
            for (let i = 0; i < dayMaterials.length; i++) {
                const mat = dayMaterials[i];
                const ud = mat.userData;
                mat.color.lerpColors(ud.dayColorObj, ud.nightColorObj, p);
                mat.roughness = ud.dayRough + (ud.nightRough - ud.dayRough) * p;
            }

            // 5. Apple Park Glowing Ribbon Windows (Warm up as dusk falls)
            const windowGlowP = smoothstep(0.18, 0.95, p);
            for (let i = 0; i < windowMaterials.length; i++) {
                const mat = windowMaterials[i];
                const ud = mat.userData;
                mat.color.lerpColors(ud.dayColorObj, ud.nightColorObj, p);
                mat.roughness = ud.dayRough + (ud.nightRough - ud.dayRough) * p;
                mat.emissiveIntensity = ud.dayEmissive + (ud.nightEmissive - ud.dayEmissive) * windowGlowP;
            }

            // 6. Glowing White Louver & Ground Base Trims
            for (let i = 0; i < glowTrimMaterials.length; i++) {
                glowTrimMaterials[i].emissiveIntensity = 0.35 + (0.92 - 0.35) * windowGlowP;
            }

            // 7. Campus Window & Flood Lights
            for (let i = 0; i < windowLights.length; i++) {
                const wl = windowLights[i];
                wl.light.intensity = wl.nightIntensity * windowGlowP;
            }
        }

        function toggleTheme() {
            isNight = !isNight;
            const themeBtn = document.getElementById('theme-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeLabel = document.getElementById('theme-label');
            const topCard = document.getElementById('top-card');
            const detailPanel = document.getElementById('detail-panel');
            const searchResults = document.getElementById('search-results');

            if (themeTransitionTween) {
                themeTransitionTween.stop();
                themeTransitionTween = null;
            }

            if (isNight) {
                // Night Mode (Gradual fade-out from Day -> Twilight -> Starry Sky + Apple Park glowing windows + Fireworks)
                document.body.classList.replace('theme-day', 'theme-night');
                themeIcon.setAttribute('data-lucide', 'sun');
                if (themeLabel) themeLabel.textContent = '昼モードへ';
                themeBtn.classList.add('text-amber-400');
                themeBtn.classList.remove('text-gray-700');

                // UI Glass Dark Mode
                topCard.classList.replace('glass-panel', 'glass-panel-dark');
                detailPanel.classList.replace('glass-panel', 'glass-panel-dark');
                searchResults.classList.replace('glass-panel', 'glass-panel-dark');
                document.getElementById('title-text').classList.replace('text-gray-900', 'text-white');
                const mobCollapseBtn = document.getElementById('mobile-collapse-btn');
                if (mobCollapseBtn) mobCollapseBtn.classList.replace('text-gray-700', 'text-gray-200');
                const bookmarksTitle = document.getElementById('bookmarks-title');
                if (bookmarksTitle) bookmarksTitle.classList.replace('text-gray-700', 'text-gray-200');
                document.getElementById('detail-title').classList.replace('text-gray-900', 'text-white');
                document.getElementById('detail-desc').classList.replace('text-gray-600', 'text-gray-300');

                // POI labels dark background
                document.querySelectorAll('.poi-label').forEach(lbl => {
                    lbl.classList.replace('bg-white/95', 'bg-slate-900/90');
                    lbl.classList.replace('text-gray-800', 'text-white');
                });

                transitionDirection = 1;
                let launchedTransitionExtras = false;
                let launchedTransitionFireworks = false;

                themeTransitionTween = new TWEEN.Tween(themeTransitionState)
                    .to({ progress: 1.0 }, 2400)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(() => {
                        applyThemeProgress(themeTransitionState.progress);

                        // Trigger shooting stars as the starry sky emerges from twilight
                        if (!launchedTransitionExtras && themeTransitionState.progress >= 0.52) {
                            launchedTransitionExtras = true;
                            spawn3DShootingStar();
                            spawnOverlayShootingStar();
                        }
                        // Launch celebratory Museum fireworks once the night sky & stars have emerged
                        if (!launchedTransitionFireworks && themeTransitionState.progress >= 0.76 && isNight) {
                            launchedTransitionFireworks = true;
                            launchMuseumFirework(true);
                            setTimeout(() => { if (isNight) launchMuseumFirework(false); }, 260);
                            spawn3DShootingStar();
                        }
                    })
                    .onComplete(() => {
                        transitionDirection = 0;
                        applyThemeProgress(1.0);
                    })
                    .start();
            } else {
                // Day Mode (Smooth dawn fade-out of stars back into bright Day Mode)
                document.body.classList.replace('theme-night', 'theme-day');
                themeIcon.setAttribute('data-lucide', 'moon');
                if (themeLabel) themeLabel.textContent = '夜モード';
                themeBtn.classList.remove('text-amber-400');
                themeBtn.classList.add('text-gray-700');

                // Clear fireworks & reset boost in day mode
                clearMuseumFireworks();
                if (isFireworkBoost) {
                    isFireworkBoost = false;
                    updateFireworkBoostButtonUI();
                }

                // UI Glass Light Mode
                topCard.classList.replace('glass-panel-dark', 'glass-panel');
                detailPanel.classList.replace('glass-panel-dark', 'glass-panel');
                searchResults.classList.replace('glass-panel-dark', 'glass-panel');
                document.getElementById('title-text').classList.replace('text-white', 'text-gray-900');
                const mobCollapseBtn = document.getElementById('mobile-collapse-btn');
                if (mobCollapseBtn) mobCollapseBtn.classList.replace('text-gray-200', 'text-gray-700');
                const bookmarksTitle = document.getElementById('bookmarks-title');
                if (bookmarksTitle) bookmarksTitle.classList.replace('text-gray-200', 'text-gray-700');
                document.getElementById('detail-title').classList.replace('text-white', 'text-gray-900');
                document.getElementById('detail-desc').classList.replace('text-gray-300', 'text-gray-600');

                // POI labels light background
                document.querySelectorAll('.poi-label').forEach(lbl => {
                    lbl.classList.replace('bg-slate-900/90', 'bg-white/95');
                    lbl.classList.replace('text-white', 'text-gray-800');
                });

                transitionDirection = -1;
                themeTransitionTween = new TWEEN.Tween(themeTransitionState)
                    .to({ progress: 0.0 }, 1650)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(() => {
                        applyThemeProgress(themeTransitionState.progress);
                    })
                    .onComplete(() => {
                        transitionDirection = 0;
                        applyThemeProgress(0.0);
                    })
                    .start();
            }

            renderBookmarksUI();
            lucide.createIcons();
        }

        // ==========================================
        // 10. UI Setup & Interactions
        // ==========================================
        function setupUI() {
            // Mobile-Only Top Card Compact Collapse / Expand
            const mobileCollapseBtn = document.getElementById('mobile-collapse-btn');
            const mobileCollapseIcon = document.getElementById('mobile-collapse-icon');
            const topCardBody = document.getElementById('top-card-body');
            const topCardHeaderTrigger = document.getElementById('top-card-header-trigger');
            let isMobileCollapsed = true;

            const setMobileCollapsed = (collapsed) => {
                isMobileCollapsed = collapsed;
                if (!topCardBody) return;
                if (isMobileCollapsed) {
                    topCardBody.classList.add('hidden');
                    if (mobileCollapseIcon) mobileCollapseIcon.style.transform = 'rotate(0deg)';
                    if (mobileCollapseBtn) mobileCollapseBtn.setAttribute('aria-expanded', 'false');
                } else {
                    topCardBody.classList.remove('hidden');
                    if (mobileCollapseIcon) mobileCollapseIcon.style.transform = 'rotate(180deg)';
                    if (mobileCollapseBtn) mobileCollapseBtn.setAttribute('aria-expanded', 'true');
                }
            };

            if (mobileCollapseBtn) {
                mobileCollapseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setMobileCollapsed(!isMobileCollapsed);
                });
            }

            if (topCardHeaderTrigger) {
                topCardHeaderTrigger.addEventListener('click', () => {
                    if (window.innerWidth < 768) {
                        setMobileCollapsed(!isMobileCollapsed);
                    }
                });
            }

            // Mobile header bookmark badge opens top card body so user can see bookmarks
            const mobileBookmarkBadge = document.getElementById('mobile-bookmark-badge');
            if (mobileBookmarkBadge) {
                mobileBookmarkBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setMobileCollapsed(false);
                });
            }

            // Bookmarks List delegation (click chip to focus, click × to remove)
            const bookmarksListEl = document.getElementById('bookmarks-list');
            if (bookmarksListEl) {
                bookmarksListEl.addEventListener('click', (e) => {
                    const removeBtn = e.target.closest('.remove-bookmark-btn');
                    if (removeBtn) {
                        e.stopPropagation();
                        const id = removeBtn.dataset.id;
                        if (id) toggleBookmark(id);
                        return;
                    }
                    const chip = e.target.closest('.bookmark-chip');
                    if (chip) {
                        const id = chip.dataset.id;
                        if (id) {
                            focusOnPoi(id, false, true);
                            if (window.innerWidth < 768) {
                                setMobileCollapsed(true);
                            }
                        }
                    }
                });
            }

            // Clear all bookmarks button
            const clearBookmarksBtn = document.getElementById('clear-bookmarks-btn');
            if (clearBookmarksBtn) {
                clearBookmarksBtn.addEventListener('click', () => {
                    bookmarkedIds = [];
                    saveBookmarks();
                    renderBookmarksUI();
                });
            }

            // Detail Card Bookmark button
            const detailBookmarkBtn = document.getElementById('detail-bookmark-btn');
            if (detailBookmarkBtn) {
                detailBookmarkBtn.addEventListener('click', () => {
                    if (selectedPoiId) {
                        toggleBookmark(selectedPoiId);
                    }
                });
            }

            // Theme toggle
            document.getElementById('theme-btn').addEventListener('click', toggleTheme);

            // Facility Navigation visibility toggle (with ON/OFF badge & detail card suppression)
            document.getElementById('labels-btn').addEventListener('click', () => {
                showLabels = !showLabels;
                poiDirty = true;
                const btn = document.getElementById('labels-btn');
                const statusBadge = document.getElementById('labels-status');

                if (showLabels) {
                    btn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-blue-600 text-white shadow-md hover:bg-blue-700 active:scale-95 transition border border-blue-400/40';
                    if (statusBadge) {
                        statusBadge.textContent = 'ON';
                        statusBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/25 text-white ml-1';
                    }
                } else {
                    btn.className = 'flex items-center justify-between px-3 py-2 rounded-2xl bg-gray-500/20 text-gray-500 shadow-inner hover:bg-gray-500/30 active:scale-95 transition border border-gray-400/30';
                    if (statusBadge) {
                        statusBadge.textContent = 'OFF';
                        statusBadge.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-gray-500/30 text-gray-500 ml-1';
                    }
                    // Hide facility explanation immediately when turned OFF
                    hideDetailCard();
                }
            });

            // Powerful Fireworks Boost toggle button
            document.getElementById('firework-boost-btn').addEventListener('click', () => {
                isFireworkBoost = !isFireworkBoost;

                // Automatically switch to Night Mode if activated during Day Mode
                if (isFireworkBoost && !isNight) {
                    toggleTheme();
                }

                updateFireworkBoostButtonUI();

                if (isFireworkBoost) {
                    // Launch an immediate multi-shot starmine salvo in front of Kansai University Museum
                    launchMuseumFirework(true, true);
                    launchMuseumFirework(true, true);
                    for (let k = 1; k <= 5; k++) {
                        setTimeout(() => {
                            if (isNight && isFireworkBoost) {
                                launchMuseumFirework(k <= 2, true);
                            }
                        }, k * 110);
                    }
                }
            });

            // Compass reset
            const compassBtn = document.getElementById('compass-btn');
            compassBtn.addEventListener('click', () => {
                animateCamera([0, 175, 240], [0, 5, 0]);
            });

            // 2D / 3D Toggle
            const dimBtn = document.getElementById('dim-btn');
            dimBtn.addEventListener('click', () => {
                is3D = !is3D;
                dimBtn.textContent = is3D ? '3D' : '2D';
                if (!is3D) {
                    animateCamera([0, 260, 1], [0, 0, 0]);
                } else {
                    animateCamera([0, 185, 250], [0, 5, 0]);
                }
            });

            // Single Field of View (FOV) Rotary Toggle Control (Using the exact attached shape icon)
            const fovToggle = document.getElementById('fov-toggle');
            const fovToggleIcon = document.getElementById('fov-toggle-icon');

            let dialRotationDeg = 0;
            let fovHasBeenPressed = false;
            let fovIdleRotateTimer = null;

            const stopFovIdleAnimation = () => {
                if (fovHasBeenPressed) return;
                fovHasBeenPressed = true;
                if (fovIdleRotateTimer) {
                    clearInterval(fovIdleRotateTimer);
                    fovIdleRotateTimer = null;
                }
                if (fovToggleIcon) {
                    fovToggleIcon.style.transition = '';
                }
            };

            const syncDialVisuals = (clampedFov, customDeg = null) => {
                if (customDeg !== null) {
                    dialRotationDeg = customDeg;
                } else {
                    dialRotationDeg = ((clampedFov - 30) / (85 - 30)) * 270;
                }
                if (fovToggleIcon) {
                    fovToggleIcon.style.transform = `rotate(${dialRotationDeg}deg)`;
                }
                if (fovToggle) {
                    fovToggle.title = `視野の広さ: ${clampedFov}° (回して調整 / クリックで切替)`;
                }
            };

            const applyFov = (newFov, smooth = false, customDeg = null) => {
                const clamped = Math.max(30, Math.min(85, Math.round(newFov)));
                syncDialVisuals(clamped, customDeg);

                if (smooth) {
                    new TWEEN.Tween(camera)
                        .to({ fov: clamped }, 320)
                        .easing(TWEEN.Easing.Quadratic.Out)
                        .onUpdate(() => {
                            camera.updateProjectionMatrix();
                            poiDirty = true;
                        })
                        .start();
                } else {
                    camera.fov = clamped;
                    camera.updateProjectionMatrix();
                    poiDirty = true;
                }
            };

            // Initialize toggle at 0° rotation (default FOV 55°)
            syncDialVisuals(55, 0);

            // Until the wide-angle (FOV) button is pressed by the user, rotate it smoothly every 5 seconds
            fovIdleRotateTimer = setInterval(() => {
                if (fovHasBeenPressed || !fovToggleIcon) return;
                dialRotationDeg += 180;
                fovToggleIcon.style.transition = 'transform 0.78s cubic-bezier(0.34, 1.56, 0.64, 1)';
                fovToggleIcon.style.transform = `rotate(${dialRotationDeg}deg)`;
            }, 5000);

            // Step-rotate the 8-lobed toggle by +45° (1 lobe) on click/tap
            const stepRotateToggle = () => {
                const presets = [38, 48, 55, 68, 82];
                const cur = Math.round(camera.fov);
                const nextPreset = presets.find(p => p > cur + 2) || presets[0];
                applyFov(nextPreset, true, dialRotationDeg + 45);
            };

            // Attach interactive rotary drag, wheel spin, and click-toggle to the single shape toggle
            if (fovToggle) {
                let dragging = false;
                let moved = false;
                let startAngle = 0;
                let startFov = 55;
                let startX = 0;
                let startY = 0;
                let baseDeg = 0;

                const getPointerAngleDeg = (clientX, clientY) => {
                    const rect = fovToggle.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    return Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI);
                };

                fovToggle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    stopFovIdleAnimation();
                    dragging = true;
                    moved = false;
                    startX = e.clientX;
                    startY = e.clientY;
                    startAngle = getPointerAngleDeg(e.clientX, e.clientY);
                    startFov = camera.fov;
                    baseDeg = dialRotationDeg;
                    if (fovToggleIcon) fovToggleIcon.style.transition = 'none';
                    fovToggle.setPointerCapture(e.pointerId);
                });

                fovToggle.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    if (Math.hypot(dx, dy) > 4) moved = true;
                    if (!moved) return;

                    let angleDiff = getPointerAngleDeg(e.clientX, e.clientY) - startAngle;
                    if (angleDiff > 180) angleDiff -= 360;
                    if (angleDiff < -180) angleDiff += 360;

                    const linearDelta = (dx - dy) * 0.45;
                    const effectiveDegDelta = Math.abs(angleDiff) > Math.abs(linearDelta) ? angleDiff : linearDelta;
                    const targetFov = Math.max(30, Math.min(85, startFov + effectiveDegDelta * 0.28));
                    applyFov(targetFov, false, baseDeg + effectiveDegDelta);
                });

                const endDrag = (e) => {
                    if (!dragging) return;
                    dragging = false;
                    if (fovToggleIcon) fovToggleIcon.style.transition = '';
                    try { fovToggle.releasePointerCapture(e.pointerId); } catch (_) {}
                    if (!moved) {
                        stepRotateToggle();
                    }
                };

                fovToggle.addEventListener('pointerup', endDrag);
                fovToggle.addEventListener('pointercancel', endDrag);

                fovToggle.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    stopFovIdleAnimation();
                    const step = e.deltaY > 0 ? 3 : -3;
                    const nextFov = Math.max(30, Math.min(85, camera.fov + step));
                    applyFov(nextFov, false, dialRotationDeg + step * 5);
                }, { passive: false });
            }

            // Zoom In / Out
            document.getElementById('zoom-in-btn').addEventListener('click', () => {
                const dir = camera.position.clone().sub(controls.target).normalize();
                new TWEEN.Tween(camera.position)
                    .to(camera.position.clone().sub(dir.multiplyScalar(35)), 300)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
            });
            document.getElementById('zoom-out-btn').addEventListener('click', () => {
                const dir = camera.position.clone().sub(controls.target).normalize();
                new TWEEN.Tween(camera.position)
                    .to(camera.position.clone().add(dir.multiplyScalar(35)), 300)
                    .easing(TWEEN.Easing.Quadratic.Out)
                    .start();
            });

            // Home Full View
            document.getElementById('home-btn').addEventListener('click', () => {
                isTrashFocusMode = false;
                poiDirty = true;
                animateCamera([0, 175, 240], [0, 5, 0]);
                hideDetailCard();
            });

            // Detail Card Close & Closer Zoom
            document.getElementById('close-detail-btn').addEventListener('click', hideDetailCard);
            document.getElementById('detail-zoom-btn').addEventListener('click', () => {
                if (selectedPoiId) focusOnPoi(selectedPoiId, true);
            });

            // Quick Category Pills
            document.querySelectorAll('.quick-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.quick-pill').forEach(p => p.classList.remove('active', 'border-blue-500', 'border-red-500'));

                    const focusKey = btn.dataset.focus;

                    if (focusKey === 'trash') {
                        btn.classList.add('active', 'border-red-500');
                        isTrashFocusMode = true;
                        poiDirty = true;
                        hideDetailCard();
                        // Overview the entire campus so all trash bin locations can be referenced at a glance
                        if (!is3D) {
                            animateCamera([0, 260, 1], [0, 0, 10]);
                        } else {
                            animateCamera([0, 210, 205], [0, 0, 10]);
                        }
                        return;
                    }

                    btn.classList.add('active', 'border-blue-500');
                    if (isTrashFocusMode) {
                        isTrashFocusMode = false;
                        poiDirty = true;
                    }

                    if (focusKey === 'all') {
                        animateCamera([0, 175, 240], [0, 5, 0]);
                        hideDetailCard();
                    } else if (focusKey === 'gate') {
                        focusOnPoi('main-gate');
                    } else if (focusKey === 'library') {
                        focusOnPoi('library');
                    } else if (focusKey === 'shobunkan') {
                        focusOnPoi('shobunkan');
                    } else if (focusKey === 'seishinkan') {
                        focusOnPoi('seishinkan');
                    } else if (focusKey === 'bldg2') {
                        focusOnPoi('bldg2');
                    } else if (focusKey === 'museum') {
                        focusOnPoi('museum');
                    } else if (focusKey === 'symphony') {
                        focusOnPoi('symphony');
                    } else if (focusKey === 'bldg4') {
                        focusOnPoi('bldg4');
                    } else if (focusKey === 'sports') {
                        focusOnPoi('ground-central');
                    } else if (focusKey === 'circolo') {
                        focusOnPoi('circolo');
                    }
                });
            });

            // Search Bar Functionality (Pre-indexed search strings for instant filtering)
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const clearBtn = document.getElementById('clear-search-btn');
            const allSearchableItems = [...TENT_AND_BIN_DATA, ...POI_DATA];

            searchInput.addEventListener('input', (e) => {
                const q = e.target.value.trim().toLowerCase();
                if (!q) {
                    searchResults.classList.add('hidden');
                    clearBtn.classList.add('hidden');
                    return;
                }
                clearBtn.classList.remove('hidden');

                const matches = allSearchableItems.filter(p => p._searchStr && p._searchStr.includes(q)).sort((a, b) => {
                    const aExact = a.tentNo && a.tentNo.toLowerCase() === q ? 0 : (a.tentNo && a.tentNo.toLowerCase().startsWith(q) ? 1 : 2);
                    const bExact = b.tentNo && b.tentNo.toLowerCase() === q ? 0 : (b.tentNo && b.tentNo.toLowerCase().startsWith(q) ? 1 : 2);
                    return aExact - bExact;
                });

                if (matches.length === 0) {
                    searchResults.innerHTML = `<div class="p-3 text-center text-gray-400">見つかりませんでした</div>`;
                } else {
                    searchResults.innerHTML = matches.map(p => {
                        const saved = isBookmarked(p.id);
                        return `
                        <div class="search-item flex items-center justify-between p-2 rounded-xl hover:bg-black/5 cursor-pointer transition" data-id="${p.id}">
                            <div class="flex items-center space-x-2.5 min-w-0 pr-2">
                                <div class="w-6 h-6 rounded-full flex items-center justify-center text-white text-[10px] font-black flex-shrink-0" style="background-color: ${p.color};">
                                    ${p.tentNo ? `<span>${p.tentNo.slice(0, 3)}</span>` : `<i data-lucide="${p.icon}" class="w-3.5 h-3.5"></i>`}
                                </div>
                                <div class="truncate">
                                    <div class="font-bold ${isNight ? 'text-gray-100' : 'text-gray-800'} text-xs truncate">${p.name}</div>
                                    <div class="text-[10px] text-gray-400">${p.category}</div>
                                </div>
                            </div>
                            <button class="search-bookmark-btn flex-shrink-0 px-2 py-1 rounded-lg text-xs font-black transition ${saved ? 'bg-amber-500 text-white shadow-sm' : 'bg-amber-500/15 text-amber-600 hover:bg-amber-500/25'}" data-id="${p.id}" title="${saved ? 'ブックマーク解除' : '行きたい場所に保存'}">
                                ${saved ? '★' : '☆'}
                            </button>
                        </div>
                    `;
                    }).join('');
                }

                lucide.createIcons({ root: searchResults });
                searchResults.classList.remove('hidden');

                searchResults.querySelectorAll('.search-bookmark-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        toggleBookmark(id);
                        const saved = isBookmarked(id);
                        btn.textContent = saved ? '★' : '☆';
                        btn.title = saved ? 'ブックマーク解除' : '行きたい場所に保存';
                        btn.className = `search-bookmark-btn flex-shrink-0 px-2 py-1 rounded-lg text-xs font-black transition ${saved ? 'bg-amber-500 text-white shadow-sm' : 'bg-amber-500/15 text-amber-600 hover:bg-amber-500/25'}`;
                    });
                });

                searchResults.querySelectorAll('.search-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        focusOnPoi(id, false, true);
                        searchResults.classList.add('hidden');
                        searchInput.value = '';
                        clearBtn.classList.add('hidden');
                        if (window.innerWidth < 768) {
                            setMobileCollapsed(true);
                        }
                    });
                });
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.classList.add('hidden');
                clearBtn.classList.add('hidden');
            });

            lucide.createIcons();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeSkyOverlay();
            poiDirty = true;
        }

        // ==========================================
        // 11. Animation Loop
        // ==========================================
        const clock = new THREE.Clock();
        let compassArrowEl = null;

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);

            // 1. Update Tween
            TWEEN.update();

            // 2. Update OrbitControls
            controls.update();

            // 3. Expressway Cars Traffic Animation
            for (let i = 0; i < cars.length; i++) {
                const car = cars[i];
                car.mesh.position.x += car.speed;
                if (car.isEastbound && car.mesh.position.x > 145) {
                    car.mesh.position.x = -160;
                } else if (!car.isEastbound && car.mesh.position.x < -160) {
                    car.mesh.position.x = 145;
                }
            }

            // 3.4 Update Starry Sky & Day-to-Night Twilight Transition
            updateStarrySky(dt, clock.elapsedTime);

            // 3.5 Update Museum Fireworks in Dark Mode
            updateMuseumFireworks(dt);

            // 4 & 5. Update Compass & POI Screen Positions only when camera or visibility changed
            if (poiDirty) {
                poiDirty = false;
                if (!compassArrowEl) compassArrowEl = document.getElementById('compass-arrow');
                if (compassArrowEl) {
                    const angle = controls.getAzimuthalAngle();
                    compassArrowEl.style.transform = `rotate(${angle.toFixed(3)}rad)`;
                }
                updatePoiPositions();
            }

            // 6. Render 3D Scene
            renderer.render(scene, camera);
        }

        // Initialize when window loads
        window.addEventListener('load', init);
    </script>
</body>
