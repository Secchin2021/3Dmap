<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>関西大学 千里山キャンパス 3D MAP | Kansai Univ. 3D Campus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tween.js for smooth camera animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1522;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Apple Maps-like frosted glass */
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.9s ease, color 0.6s ease;
        }

        .glass-panel-dark {
            background: rgba(22, 32, 51, 0.88);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background-color 0.9s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.9s ease, color 0.6s ease;
        }

        @media (max-width: 767px) {
            .glass-panel, .glass-panel-dark {
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
        }

        /* POI Marker styling (GPU-composited translate3d without layout thrashing) */
        .poi-marker {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
        }

        .poi-marker:hover {
            z-index: 50 !important;
        }

        .poi-marker:hover .poi-pin {
            transform: scale(1.18);
        }

        .poi-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
        }

        .poi-label {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 2.5px 7.5px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            pointer-events: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            transition: all 0.2s;
        }

        /* Hide scrollbars for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Loading spinner */
        .loader {
            border: 3.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border-top: 3.5px solid #3b82f6;
            width: 42px;
            height: 42px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="theme-day">
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Starry Sky & Day-to-Night Twilight Transition Overlay Canvas -->
    <canvas id="sky-transition-canvas" class="absolute inset-0 pointer-events-none z-10"></canvas>

    <!-- POI Overlay Container (3D to 2D projected markers) -->
    <div id="poi-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

    <!-- UI Overlay: Top Navigation Bar -->
    <div id="top-nav-wrapper" class="absolute top-4 left-4 right-16 md:right-auto md:w-[430px] z-30 pointer-events-none">
        <div id="top-card" class="glass-panel rounded-2xl md:rounded-3xl p-2.5 md:p-4 shadow-2xl pointer-events-auto transition-all duration-300">
            <div class="flex items-center justify-between gap-2">
                <div id="top-card-header-trigger" class="flex items-center space-x-2.5 md:space-x-3 min-w-0 cursor-pointer md:cursor-default">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl md:rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center text-white shadow-md flex-shrink-0">
                        <i data-lucide="map-pin" class="w-4 h-4 md:w-5 md:h-5"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 id="title-text" class="text-gray-900 font-extrabold text-xs sm:text-sm md:text-base tracking-tight leading-none truncate">関西大学 千里山キャンパス</h1>
                        <p id="subtitle-text" class="text-gray-500 text-[10px] md:text-xs mt-0.5 md:mt-1 font-medium truncate">Designed by Versear</p>
                    </div>
                </div>

                <div class="flex items-center space-x-1.5 flex-shrink-0">
                    <!-- Mobile Bookmark Quick Badge -->
                    <button id="mobile-bookmark-badge" title="保存した行きたい場所を表示"
                        class="hidden md:hidden items-center space-x-1 px-2 py-1.5 rounded-xl bg-amber-500/15 text-amber-600 border border-amber-400/40 text-[11px] font-extrabold active:scale-95 transition">
                        <span>★</span>
                        <span id="mobile-bookmark-count">0</span>
                    </button>

                    <!-- Day/Night Toggle -->
                    <button id="theme-btn" title="昼/夜モード切替" class="flex items-center space-x-1 px-2.5 py-1.5 md:px-3 md:py-2 rounded-xl md:rounded-2xl bg-black/5 hover:bg-black/10 active:scale-95 transition text-gray-700 border border-black/5">
                        <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                        <span id="theme-label" class="text-[11px] md:text-xs font-extrabold">夜モード</span>
                    </button>

                    <!-- Mobile-Only Collapse / Expand Button -->
                    <button id="mobile-collapse-btn" title="メニューを収納 / 展開" aria-expanded="false"
                        class="md:hidden w-8 h-8 rounded-xl bg-black/5 hover:bg-black/10 active:scale-95 transition flex items-center justify-center text-gray-700 border border-black/5">
                        <i id="mobile-collapse-icon" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200"></i>
                    </button>
                </div>
            </div>

            <!-- Collapsible Body on Mobile (Always visible on Desktop md+) -->
            <div id="top-card-body" class="hidden md:block">
                <!-- Action Buttons Row: Facility Navigation ON/OFF & Firework Boost Button -->
                <div class="mt-3 grid grid-cols-2 gap-2">
                    <!-- Facility Info & Navigation Toggle Button -->
                    <button id="labels-btn" title="施設説明ナビゲーションの表示・非表示を切り替えます" class="flex items-center justify-between px-3 py-2 rounded-2xl bg-blue-600 text-white shadow-md hover:bg-blue-700 active:scale-95 transition border border-blue-400/40">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="message-square-more" class="w-4 h-4 flex-shrink-0"></i>
                            <span class="text-xs font-extrabold tracking-tight">施設説明ナビ</span>
                        </div>
                        <span id="labels-status" class="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/25 text-white ml-1">ON</span>
                    </button>

                    <!-- Powerful Fireworks Boost Button -->
                    <button id="firework-boost-btn" title="博物館正面の花火を超強力なスターマイン連発にします" class="flex items-center justify-between px-3 py-2 rounded-2xl bg-slate-800/90 text-amber-300 shadow-md hover:bg-slate-900 active:scale-95 transition border border-amber-400/30">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="sparkles" class="w-4 h-4 flex-shrink-0 text-amber-400"></i>
                            <span class="text-xs font-extrabold tracking-tight">花火を強力化</span>
                        </div>
                        <span id="firework-boost-status" class="text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/15 text-amber-200 ml-1">OFF</span>
                    </button>
                </div>

                <!-- Quick Search Bar -->
                <div class="mt-2.5 relative">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input id="search-input" type="text" placeholder="施設・学舎・テント番号(1A〜50B)・ゴミ箱を検索..." 
                        class="w-full pl-9 pr-8 py-2 text-xs rounded-xl bg-gray-100/80 border border-transparent focus:border-blue-400 focus:bg-white focus:outline-none transition text-gray-800 placeholder-gray-400" />
                    <button id="clear-search-btn" class="hidden absolute right-2.5 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>

                    <!-- Search Results Dropdown -->
                    <div id="search-results" class="hidden absolute left-0 right-0 top-full mt-1.5 max-h-56 overflow-y-auto rounded-2xl glass-panel shadow-2xl p-1.5 z-40 space-y-1 text-xs">
                    </div>
                </div>

                <!-- Saved Bookmarks (行きたい場所 - Persisted in Browser localStorage) -->
                <div id="bookmarks-section" class="mt-2.5 pt-2 border-t border-black/5">
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-amber-500 text-xs font-black">★</span>
                            <span id="bookmarks-title" class="text-[11px] font-extrabold text-gray-700">行きたい場所 (ブックマーク)</span>
                            <span id="bookmark-count-badge" class="text-[10px] font-black px-1.5 py-0.2 rounded-full bg-amber-500/15 text-amber-600">0</span>
                        </div>
                        <button id="clear-bookmarks-btn" class="hidden text-[10px] font-bold text-gray-400 hover:text-red-500 transition">
                            すべて解除
                        </button>
                    </div>
                    <div id="bookmarks-list" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                        <span class="text-[10px] text-gray-400 py-0.5">施設や検索結果の「★」で保存できます</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- UI Overlay: Right Control Stack (Apple Maps Style) -->
    <div class="absolute top-4 right-4 z-30 flex flex-col space-y-2 pointer-events-auto">
        <!-- Compass -->
        <button id="compass-btn" title="方角を北に戻す" class="w-11 h-11 rounded-2xl glass-panel shadow-lg flex items-center justify-center text-gray-700 hover:scale-105 active:scale-95 transition">
            <svg id="compass-arrow" class="w-5 h-5 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 19 21 12 17 5 21 12 2" fill="#ef4444" stroke="#ef4444" stroke-width="1.5" />
            </svg>
        </button>

        <!-- 2D / 3D Toggle -->
        <button id="dim-btn" title="2D俯瞰 / 3D視点切替" class="w-11 h-11 rounded-2xl glass-panel shadow-lg flex items-center justify-center font-bold text-xs text-gray-700 hover:scale-105 active:scale-95 transition">
            3D
        </button>

        <!-- Single FOV Rotary Toggle (Exact Attached Shape Icon Only) -->
        <div id="fov-toggle" title="視野の広さトグル (回して調整 / クリックで切替)"

        // Bookmarks (行きたい場所) persisted in browser localStorage
        const BOOKMARK_STORAGE_KEY = 'ku_3dmap_bookmarks_v1';
        let bookmarkedIds = [];

        function loadBookmarks() {
            try {
                const raw = localStorage.getItem(BOOKMARK_STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        bookmarkedIds = parsed.filter(id => typeof id === 'string');
                    }
                }
            } catch (err) {
                console.warn('Bookmark load error:', err);
                bookmarkedIds = [];
            }
        }

        function saveBookmarks() {
            try {
                localStorage.setItem(BOOKMARK_STORAGE_KEY, JSON.stringify(bookmarkedIds));
            } catch (err) {
                console.warn('Bookmark save error:', err);
            }
        }

        function isBookmarked(id) {
            return bookmarkedIds.includes(id);
        }

        function findPlaceById(id) {
            return POI_DATA.find(p => p.id === id) || TENT_AND_BIN_DATA.find(t => t.id === id);
        }

        function updateDetailBookmarkUI(id) {
            const btn = document.getElementById('detail-bookmark-btn');
            const star = document.getElementById('detail-bookmark-star');
            const label = document.getElementById('detail-bookmark-label');
            if (!btn || !star || !label) return;

            if (id && isBookmarked(id)) {
                star.textContent = '★';
                label.textContent = '保存済み';
                btn.className = 'px-2.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white border border-amber-400 font-extrabold transition active:scale-95 shadow-sm flex items-center space-x-1';
            } else {
                star.textContent = '☆';
                label.textContent = '保存';
                btn.className = 'px-2.5 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-600 border border-amber-400/40 font-extrabold transition active:scale-95 shadow-sm flex items-center space-x-1';
            }
        }

        function renderBookmarksUI() {
            const listEl = document.getElementById('bookmarks-list');
            const countBadge = document.getElementById('bookmark-count-badge');
            const clearAllBtn = document.getElementById('clear-bookmarks-btn');
            const mobileBadge = document.getElementById('mobile-bookmark-badge');
            const mobileCount = document.getElementById('mobile-bookmark-count');

            // Filter out any unknown IDs
            const validItems = bookmarkedIds.map(id => findPlaceById(id)).filter(Boolean);
            const count = validItems.length;

            if (countBadge) countBadge.textContent = String(count);
            if (mobileCount) mobileCount.textContent = String(count);
            if (mobileBadge) {
                if (count > 0) {
                    mobileBadge.classList.remove('hidden');
                    mobileBadge.classList.add('flex');
                } else {
                    mobileBadge.classList.add('hidden');
                    mobileBadge.classList.remove('flex');
                }
            }
            if (clearAllBtn) {
                if (count > 0) {
                    clearAllBtn.classList.remove('hidden');
                } else {
                    clearAllBtn.classList.add('hidden');
                }
            }

            // Update 3D Map POI Marker star badges
            poiElements.forEach(item => {
                const badge = item.element.querySelector('.poi-bookmark-star');
                if (badge) {
                    badge.style.display = isBookmarked(item.id) ? 'inline' : 'none';
                }
            });

            // Update detail card button if open
            if (selectedPoiId) {
                updateDetailBookmarkUI(selectedPoiId);
            }

            if (!listEl) return;

            if (count === 0) {
                listEl.innerHTML = `<span class="text-[10px] text-gray-400 py-0.5">施設や検索結果の「☆」で行きたい場所を保存できます</span>`;
                return;
            }

            listEl.innerHTML = validItems.map(p => {

        // ==========================================
        // 3. Procedural Texture Generators
        // ==========================================
        function createTrackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#b44837';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            const cx = 512, cy = 512;
            const rw = 400, rh = 280;

            for (let i = 0; i < 6; i++) {
                const w = rw - i * 16;
                const h = rh - i * 16;
                ctx.beginPath();
                ctx.ellipse(cx, cy, w, h, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.fillStyle = '#487937';
            ctx.beginPath();
            ctx.ellipse(cx, cy, rw - 96, rh - 96, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 4;
            ctx.strokeRect(cx - 200, cy - 120, 400, 240);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 120);
            ctx.lineTo(cx, cy + 120);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, Math.PI * 2);
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

            ctx.moveTo(256, 450);
            ctx.arc(256, 450, 280, -Math.PI * 0.85, -Math.PI * 0.15);

            ctx.moveTo(256, 380);
            ctx.lineTo(190, 310);

            ctx.fill();

        // 3.5 Apple Park Style Glowing Ribbon Window & Louver Textures
        function createAppleParkWindowTextures(wallColorHex, floors = 4, repeatX = 4, style = 'ribbon') {
            const width = IS_MOBILE ? 256 : 512;
            const height = IS_MOBILE ? 128 : 256;

            // Color Texture Canvas
            const colCanvas = document.createElement('canvas');
            colCanvas.width = width;
            colCanvas.height = height;
            const cCtx = colCanvas.getContext('2d');

            // Emissive Texture Canvas (Controls glowing window bands)
            const emiCanvas = document.createElement('canvas');
            emiCanvas.width = width;
            emiCanvas.height = height;
            const eCtx = emiCanvas.getContext('2d');

            // Fill base wall
            const hexStr = '#' + new THREE.Color(wallColorHex).getHexString();
            cCtx.fillStyle = hexStr;
            cCtx.fillRect(0, 0, width, height);

            eCtx.fillStyle = '#000000';
            eCtx.fillRect(0, 0, width, height);

            const floorH = height / floors;

            for (let f = 0; f < floors; f++) {
                const yTop = f * floorH;
                // Window band dimensions (Balanced wall spandrel + Apple Park glowing ribbon glass)
                const winMarginTop = style === 'pavilion' ? floorH * 0.18 : floorH * 0.34;
                const winMarginBottom = style === 'pavilion' ? floorH * 0.14 : floorH * 0.20;
                const winY = yTop + winMarginTop;
                const winH = floorH - winMarginTop - winMarginBottom;

                // Dark architectural shadow line right above window
                cCtx.fillStyle = 'rgba(15, 23, 42, 0.55)';
                cCtx.fillRect(0, winY - 3, width, 3);

                // Warm glowing interior gradient (Apple Park creamy champagne light)
                const gradCol = cCtx.createLinearGradient(0, winY, 0, winY + winH);
                gradCol.addColorStop(0, '#fffef5');
                gradCol.addColorStop(0.45, '#ffebb3');
                gradCol.addColorStop(1, '#eab85c');
                cCtx.fillStyle = gradCol;
                cCtx.fillRect(0, winY, width, winH);

                const gradEmi = eCtx.createLinearGradient(0, winY, 0, winY + winH);
                gradEmi.addColorStop(0, '#ffffff');
                gradEmi.addColorStop(0.5, '#ffe699');
                gradEmi.addColorStop(1, '#d4a348');
                eCtx.fillStyle = gradEmi;
                eCtx.fillRect(0, winY, width, winH);

                // Subtle room light variation along the ribbon while keeping Apple Park continuity
                const segments = style === 'pavilion' ? 10 : 16;
                const segW = width / segments;
                for (let s = 0; s < segments; s++) {
                    const seed = Math.sin((f + 1) * 19.7 + (s + 1) * 31.3) * 0.5 + 0.5;
                    if (seed < 0.18 && style !== 'pavilion') {
                        cCtx.fillStyle = 'rgba(30, 42, 62, 0.45)';
                        cCtx.fillRect(s * segW, winY, segW, winH);
                        eCtx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                        eCtx.fillRect(s * segW, winY, segW, winH);
                    } else if (seed > 0.72) {
                        eCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        eCtx.fillRect(s * segW, winY, segW, winH);
                    }

                    // Crisp vertical mullions (Apple Park glass curtain wall dividers)
                    const mullionW = style === 'pavilion' ? 2.5 : 4.5;
                    cCtx.fillStyle = style === 'pavilion' ? 'rgba(180, 195, 210, 0.75)' : hexStr;
                    cCtx.fillRect(s * segW, winY, mullionW, winH);
                    eCtx.fillStyle = '#000000';
                    eCtx.fillRect(s * segW, winY, mullionW - 0.5, winH);
                }

                // White horizontal louver canopy strip (Signature Apple Park ring look)
                const louverH = Math.max(3, floorH * 0.09);
                cCtx.fillStyle = '#f1f5f9';
                cCtx.fillRect(0, winY - louverH, width, louverH);
                eCtx.fillStyle = '#8a7f68';
                eCtx.fillRect(0, winY - louverH * 0.5, width, louverH * 0.5);
            }

            const colorTex = new THREE.CanvasTexture(colCanvas);
            colorTex.wrapS = THREE.RepeatWrapping;
            colorTex.wrapT = THREE.ClampToEdgeWrapping;
            colorTex.repeat.set(repeatX, 1);

            const emissiveTex = new THREE.CanvasTexture(emiCanvas);
            emissiveTex.wrapS = THREE.RepeatWrapping;
            emissiveTex.wrapT = THREE.ClampToEdgeWrapping;
            emissiveTex.repeat.set(repeatX, 1);

            return { colorTex, emissiveTex };
        }

        // Create a building facade material with Apple Park glowing windows
        function createFacadeMat(dayColor, nightColor, floors = 4, repeatX = 3, style = 'ribbon') {
            const { colorTex, emissiveTex } = createAppleParkWindowTextures(dayColor, floors, repeatX, style);
            const mat = new THREE.MeshStandardMaterial({
                map: colorTex,

                dayColorObj: new THREE.Color(0xffffff),
                nightColorObj: new THREE.Color(0x9fb4d4),
                dayRough: 0.45,
                nightRough: 0.35,
                dayEmissive: 0.72,
                nightEmissive: 1.55
            };
            windowMaterials.push(mat);

        }

        // 3.6 Soft Radial Glow Particle Texture for Fireworks
        function createSparkTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.25, 'rgba(255, 250, 220, 0.9)');
            grad.addColorStop(0.6, 'rgba(255, 220, 150, 0.35)');
            grad.addColorStop(1, 'rgba(255, 200, 100, 0)');

            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // 3.7 Cross-Sparkle Star Texture (Glowing core + 4-point diffraction spikes)
        function createStarSparkleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const cx = 64, cy = 64;

            // Soft radial halo
            const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, 56);
            halo.addColorStop(0, 'rgba(255, 255, 255, 1)');
            halo.addColorStop(0.18, 'rgba(240, 248, 255, 0.85)');
            halo.addColorStop(0.45, 'rgba(186, 230, 253, 0.25)');
            halo.addColorStop(1, 'rgba(186, 230, 253, 0)');
            ctx.fillStyle = halo;
            ctx.fillRect(0, 0, 128, 128);

            // 4-point diffraction spikes
            const drawSpike = (angle, len, thickness) => {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                const grad = ctx.createLinearGradient(-len, 0, len, 0);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
                grad.addColorStop(0.35, 'rgba(255, 255, 255, 0.45)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 1)');
                grad.addColorStop(0.65, 'rgba(255, 255, 255, 0.45)');
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, len, thickness, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };
            drawSpike(0, 60, 2.2);
            drawSpike(Math.PI / 2, 60, 2.2);
            drawSpike(Math.PI / 4, 34, 1.3);
            drawSpike(-Math.PI / 4, 34, 1.3);

            return new THREE.CanvasTexture(canvas);
        }

        // Radial Alpha Map so cityGround feathers seamlessly into the Starry Sky around the campus perimeter
        function createRadialGroundAlphaMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 68, 128, 128, 126);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.55, '#e2e8f0');
            grad.addColorStop(0.82, '#64748b');
            grad.addColorStop(1, '#000000');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        // Rounded-rectangle ShapeGeometry for campusGround so corners look clean against the night sky
        function createRoundedGroundGeo(w, d, r) {
            const shape = new THREE.Shape();
            const hw = w / 2, hd = d / 2;
            shape.moveTo(-hw + r, -hd);
            shape.lineTo(hw - r, -hd);
            shape.quadraticCurveTo(hw, -hd, hw, -hd + r);
            shape.lineTo(hw, hd - r);
            shape.quadraticCurveTo(hw, hd, hw - r, hd);
            shape.lineTo(-hw + r, hd);
            shape.quadraticCurveTo(-hw, hd, -hw, hd - r);
            shape.lineTo(-hw, -hd + r);
            shape.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
            return new THREE.ShapeGeometry(shape, 12);
        }

        // ==========================================
        // 4. Initialization
        // ==========================================
        function init() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(PALETTE.day.bg);
            scene.fog = new THREE.FogExp2(PALETTE.day.fog, 0.00055);

            // 2. Camera (Wider 55° default FOV & extended far plane for wide panoramic views)
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 2500);
            camera.position.set(0, 185, 250);

            // 3. Renderer (Mobile-optimized pixelRatio & shadow settings for smooth FPS)
            renderer = new THREE.WebGLRenderer({
                antialias: !IS_MOBILE,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, IS_MOBILE ? 1.25 : 1.75));
            renderer.shadowMap.enabled = !IS_MOBILE;
            renderer.shadowMap.type = THREE.PCFShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // 4. Controls (Expanded zoom range: 12 to 900)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxPolarAngle = Math.PI / 2.02;
            controls.minDistance = 12;
            controls.maxDistance = 900;
            controls.target.set(0, 5, 0);
            controls.addEventListener('change', () => { poiDirty = true; });

            // 5. Lighting Setup
            setupLighting();

            // 6. Build World Geometry & 3D/2D Starry Sky System
            buildCampus();
            setupStarrySky();

            // 7. Load Saved Bookmarks from Browser Cache (localStorage) & Setup POI Markers
            loadBookmarks();
            createPoiMarkers();

            // 8. Event Listeners & UI Binding
            setupUI();
            renderBookmarksUI();

            // Smoothly remove loading screen
            setTimeout(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 600);
                }
            }, 300);

            // Window resize
            window.addEventListener('resize', onWindowResize);

            // Raycasting for direct building click (ignore camera drag gestures)
            renderer.domElement.addEventListener('pointerdown', (e) => {
                pointerDownPos.x = e.clientX;
                pointerDownPos.y = e.clientY;
            });
            renderer.domElement.addEventListener('pointerup', onPointerClick);

            // Render loop
            animate();
        }

        // ==========================================
        // 5. Lighting Setup
        // ==========================================
        function setupLighting() {
            ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
            scene.add(ambientLight);

            // Sun (Day Light)
            sunLight = new THREE.DirectionalLight(0xfff6e8, 1.15);
            sunLight.position.set(-120, 240, 130);
            sunLight.castShadow = !IS_MOBILE;
            if (!IS_MOBILE) {
                sunLight.shadow.mapSize.width = 2048;
                sunLight.shadow.mapSize.height = 2048;
                sunLight.shadow.camera.near = 20;
                sunLight.shadow.camera.far = 700;
                const d = 260;
                sunLight.shadow.camera.left = -d;
                sunLight.shadow.camera.right = d;
                sunLight.shadow.camera.top = d;
                sunLight.shadow.camera.bottom = -d;
                sunLight.shadow.bias = -0.0005;
            }
            scene.add(sunLight);

            // Moon Light (for Night Mode - photo 1 slate blue lighting, no duplicate shadow map pass)
            moonLight = new THREE.DirectionalLight(0x9fb6dc, 0);
            moonLight.position.set(-80, 220, 120);
            moonLight.castShadow = false;
            scene.add(moonLight);
        }

        // Helper to register material for day/night sync
        function registerMat(material, dayColor, nightColor, dayRough = 0.7, nightRough = 0.6) {
            material.color.setHex(dayColor);
            material.roughness = dayRough;
            material.userData = {
                dayColor,
                nightColor,
                dayColorObj: new THREE.Color(dayColor),
                nightColorObj: new THREE.Color(nightColor),
                dayRough,
                nightRough
            };
            dayMaterials.push(material);
            return material;
        }

        // ==========================================
        // 6. Campus 3D Construction
        // ==========================================
        function buildCampus() {
            // --- Grounds & Road Bases ---
            // Outer Day Horizon Plane: opaque in Day Mode, gradually fades out during Night transition to reveal the 3D Starry Sky
            const matDayOuter = registerMat(
                new THREE.MeshStandardMaterial({ transparent: true, opacity: 1.0, depthWrite: false }),
                PALETTE.day.ground,
                PALETTE.night.ground,
                0.9,
                0.8
            );
            dayOuterGround = new THREE.Mesh(new THREE.PlaneGeometry(2200, 2200), matDayOuter);
            dayOuterGround.rotation.x = -Math.PI / 2;
            dayOuterGround.position.y = -0.06;
            dayOuterGround.renderOrder = -60;
            dayOuterGround.receiveShadow = true;
            scene.add(dayOuterGround);

            // Feathered Inner City Ground around Campus & Town Perimeter
            const groundAlphaMap = createRadialGroundAlphaMap();
            const matCityGround = registerMat(
                new THREE.MeshStandardMaterial({
                    alphaMap: groundAlphaMap,
                    transparent: true,
                    opacity: 1.0,
                    depthWrite: false
                }),
                PALETTE.day.ground,
                PALETTE.night.ground,
                0.9,
                0.8
            );
            cityGround = new THREE.Mesh(new THREE.PlaneGeometry(540, 470), matCityGround);
            cityGround.rotation.x = -Math.PI / 2;
            cityGround.position.set(-5, 0, -15);
            cityGround.renderOrder = -40;
            cityGround.receiveShadow = true;
            scene.add(cityGround);

            // Campus Main Paving Area (Opaque rounded rectangle so stars behind campus are cleanly depth-occluded)
            const matCampusPaving = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.campusPaving, PALETTE.night.campusPaving, 0.8, 0.7);
            campusGround = new THREE.Mesh(createRoundedGroundGeo(360, 310, 38), matCampusPaving);
            campusGround.rotation.x = -Math.PI / 2;
            campusGround.position.set(-5, 0.08, -10);
            campusGround.receiveShadow = true;
            scene.add(campusGround);

            // Turf & Grass helper
            const addGrass = (x, z, w, d, isTurf = false, ry = 0) => {
                const dayCol = isTurf ? PALETTE.day.turf : PALETTE.day.grass;
                const nightCol = isTurf ? PALETTE.night.turf : PALETTE.night.grass;
                const mat = registerMat(new THREE.MeshStandardMaterial({ flatShading: true }), dayCol, nightCol, 0.95, 0.9);
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.rotation.z = ry;
                mesh.position.set(x, 0.14, z);
                mesh.receiveShadow = true;
                scene.add(mesh);
                return mesh;
            };

            // Main Green Spaces (Aligned with Apple Maps 2D & 3D footprints)
            addGrass(-134, -64, 42, 62, true, -0.58); // 中央体育館北西の斜めグリーンフィールド
            addGrass(5, 12, 44, 36, false, -0.46);    // 悠久の庭 (Central Plaza Lawn)
            addGrass(-62, 32, 36, 24, false, -0.15);  // 博物館南広場
            addGrass(-26, 44, 48, 16, false, -0.15);  // 尚文館〜以文館間緑地
            addGrass(135, 10, 32, 160, false, -0.25); // 千里山トンネル沿い東側グリーンベルト

            // Common Solid Materials (Roofs, Caps, Pillars)
            const matBrick = registerMat(new THREE.MeshStandardMaterial(), PALETTE.day.brick, PALETTE.night.brick);

                let appliedMat = bodyMat;

                    if (bodyMat === matBrick) appliedMat = boxMats(facBrick4, matBrick);

                mesh.position.set(ox, h / 2, oz);

            // 関西大学 時計塔 (Clock Tower)
            const clockGrp = new THREE.Group();

            const towerBase = new THREE.Mesh(UNIT_BOX_GEO, matWhite);

            clickableObjects.push(towerBase);
            clockGrp.add(towerBase);

            const faceMat = new THREE.MeshBasicMaterial({ color: 0xfff3c4 });
            const faceGeo = new THREE.CircleGeometry(1.0, 12);

            // -------------------------------------------------------------
            // 12. 水色四角の小さなテント群 (図の通りの番号: 1A〜50B, 1〜3, 本部, 両替)
            //     ＆ 赤い印の場所の小さなゴミ箱 (ゴミ①〜⑤・ゴミステーション)
            // -------------------------------------------------------------
            const tentPoleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4, metalness: 0.5 });
            const tentRoofWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });
            const tentCounterMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.7 });
            const cyanZoneFillMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22, depthWrite: false });
            const cyanZoneBorderMat = new THREE.MeshBasicMaterial({ color: 0x0ea5e9 });
            const tentRoofConeGeo = new THREE.ConeGeometry(1.42, 0.85, 4);
            const unitPlaneGeo = new THREE.PlaneGeometry(1, 1);
            const redRingGeo = new THREE.RingGeometry(1.15, 1.65, 18);
            const redRingMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide });
            const binBodyMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
            const binLidMats = [
                new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.35 }),
                new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.35 }),
                new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.35 })
            ];
            const binPadGreenMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.6 });
            const binPadBlueMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.6 });

            // Cache materials & sprite textures to avoid duplicate GPU allocations
            const valanceMatCache = new Map();
            const getValanceMat = (hex) => {
                if (!valanceMatCache.has(hex)) {
                    valanceMatCache.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.5 }));
                }
                return valanceMatCache.get(hex);
            };

            const spriteMatCache = new Map();
            // Helper: Create crisp floating number badge sprite for tents & trash bins (Power-of-Two 128x64 canvas)
            const makeLabelSprite = (text, bgHex = '#ffffff', borderHex = '#0284c7', textHex = '#0f172a', scaleW = 3.6, scaleH = 1.85) => {
                const key = `${text}|${bgHex}|${borderHex}|${textHex}`;
                let sMat = spriteMatCache.get(key);
                if (!sMat) {
                    const c = document.createElement('canvas');
                    c.width = 128;
                    c.height = 64;
                    const ctx = c.getContext('2d');

                    const r = 14;
                    ctx.fillStyle = bgHex;
                    ctx.strokeStyle = borderHex;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.roundRect(4, 4, 120, 56, r);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = textHex;
                    ctx.font = '900 32px "Inter", "Noto Sans JP", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, 64, 34);

                    const tex = new THREE.CanvasTexture(c);
                    tex.generateMipmaps = false;
                    tex.minFilter = THREE.LinearFilter;
                    sMat = new THREE.SpriteMaterial({
                        map: tex,
                        transparent: true,
                        depthTest: false,
                        depthWrite: false
                    });
                    spriteMatCache.set(key, sMat);
                }
                const sprite = new THREE.Sprite(sMat);
                sprite.scale.set(scaleW, scaleH, 1);
                sprite.renderOrder = 999;
                return sprite;
            };

            // InstancedMesh Queues for Festival Tents, Cyan Zones & Trash Bins (~750 draw calls -> 9 draw calls)
            const tentLegQueue = [];
            const tentCounterQueue = [];
            const tentRoofQueue = [];
            const cyanPadQueue = [];
            const cyanBorderQueue = [];
            const binBodyQueue = [];
            const binLidQueues = [[], [], []];

            // Helper: Build a single small 3D festival tent with batched InstancedMesh parts & clickable valance/roof/badge
            const addSmallTent = (parent, x, z, label, valanceHex = 0x38bdf8, badgeBg = '#fffbeb', ry = 0, w = 2.0, d = 2.0, areaName = 'キャンパス内テントエリア') => {
                const tGrp = new THREE.Group();
                tGrp.position.set(x, 0, z);
                tGrp.rotation.y = ry;

                const tentId = `tent-${label}`;

                // 4 Corner Legs (Queued into single InstancedMesh)
                const hw = w * 0.44;
                const hd = d * 0.44;
                [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]].forEach(([lx, lz]) => {
                    tentLegQueue.push({ parent: tGrp, lx, ly: 0.75, lz, sx: 0.12, sy: 1.5, sz: 0.12 });

                // Counter table inside booth (Queued into single InstancedMesh)
                tentCounterQueue.push({ parent: tGrp, lx: 0, ly: 0.35, lz: 0, sx: w * 0.82, sy: 0.7, sz: d * 0.55 });

                // Colored Valance Trim (Roof Eaves)

                tGrp.add(valance);

                // Pyramidal White Tent Canopy Roof (Queued into single clickable InstancedMesh)

                tentRoofQueue.push({ parent: tGrp, ly: 2.1, ry: Math.PI / 4, scale: roofScale, poiId: tentId });

                // Assigned Number Badge hovering right over the tent peak
                const hexStr = '#' + valanceHex.toString(16).padStart(6, '0');

                badge.userData.poiId = tentId;
                clickableObjects.push(badge);
                tGrp.add(badge);

                parent.add(tGrp);

                const isSpecial = (label === '本部' || label === '両替');

                    id: tentId,
                    tentNo: label,
                    name: isSpecial ? `${label}テント (${areaName})` : `テント ${label} (${areaName})`,

                    desc: `【${areaName}】水色四角エリア内に設置された小型テント「${label}」です。検索および3Dマップ上から直接位置を確認できます。`,

            // Helper: Draw Light-Blue Rectangular Zone Frame (水色四角) on the ground (Batched into InstancedMesh)
            const addCyanZoneBox = (parent, cx, cz, w, d, ry = 0) => {

                cyanPadQueue.push({ parent: zGrp, w, d });

                const bThick = 0.35;
                cyanBorderQueue.push(
                    { parent: zGrp, lx: 0, ly: 0.06, lz: -d / 2, sx: w + bThick, sy: 0.12, sz: bThick },
                    { parent: zGrp, lx: 0, ly: 0.06, lz: d / 2, sx: w + bThick, sy: 0.12, sz: bThick },
                    { parent: zGrp, lx: -w / 2, ly: 0.06, lz: 0, sx: bThick, sy: 0.12, sz: d + bThick },
                    { parent: zGrp, lx: w / 2, ly: 0.06, lz: 0, sx: bThick, sy: 0.12, sz: d + bThick }

            // Helper: Build a Small Trash Bin / Recycling Station at Red-Marked Spots (Batched bodies & lids)
            const addRedMarkedTrashBin = (parent, x, z, label = 'ゴミ箱', stationType = 'blue', ry = 0, areaName = 'キャンパス内') => {

                const basePad = new THREE.Mesh(UNIT_BOX_GEO, stationType === 'green' ? binPadGreenMat : binPadBlueMat);

                // 3 Small Segmented Trash / Recycling Bins (可燃=赤, 不燃=青, 資源/段ボール=緑) queued into InstancedMesh
                [-0.9, 0, 0.9].forEach((bx, idx) => {

                    binLidQueues[idx].push({ parent: binGrp, lx: bx, ly: 1.25, lz: 0, sx: 0.78, sy: 0.32, sz: 0.78 });

                    ringMesh: redRing,
                    desc: `【${areaName}】赤い印の位置に設置された分別ゴミ箱（可燃・不燃・資源）です。`,
                    hours: '常時設置'

                return binGrp;
            };

            const festivalGrp = new THREE.Group();
            scene.add(festivalGrp);

            // -----------------------------------------------------------------
            // [水色四角 1] 正門北側〜第二学舎西通路の東列: 本部 + 1A, 1B, 2A, 2B, 3A, 3B, 4A, 4B
            // -----------------------------------------------------------------
            addSmallTent(festivalGrp, 90.5, 65.5, '本部', 0xf59e0b, '#fef3c7', -0.1, 2.0, 2.0, '正門北側エリア');
            addCyanZoneBox(festivalGrp, 89.2, 47.0, 3.8, 30.5, -0.1);
            const zone1List = [
                { id: '1A', z: 60.2 }, { id: '1B', z: 57.4 },

            // -----------------------------------------------------------------

            // -----------------------------------------------------------------

            // -----------------------------------------------------------------
            const zone4Slots = [
                '11A', '11B', '12A', '12B', '13A', '13B', '14A', '14B', '15A', '15B',

            const z4Start = { x: 70.0, z: 8.5 };

            addCyanZoneBox(
                festivalGrp,

                (z4Start.z + z4End.z) / 2,

                3.8,

            zone4Slots.forEach((slot, idx) => {

                } else {
                    addSmallTent(festivalGrp, tx, tz, slot, 0x22c55e, '#f0fdf4', z4Angle, 1.9, 1.9, '図書館北東メイン通り');
                }
            });

            // -----------------------------------------------------------------
            // [水色四角 5] 第四学舎の南面沿い: 25B, 25A, 24B, 24A, 23B, 23A, 22B, 22A, 21B, 21A, 20B, 20A
            // -----------------------------------------------------------------
            const zone5Ids = ['25B', '25A', '24B', '24A', '23B', '23A', '22B', '22A', '21B', '21A', '20B', '20A'];
            addCyanZoneBox(b4Grp, 0, 22.8, 34.5, 3.8, 0);
            zone5Ids.forEach((id, idx) => {

            // -----------------------------------------------------------------
            const zone6Slots = [

            addCyanZoneBox(seishinGrp, 2, -14.8, 46.5, 3.6, 0);
            zone6Slots.forEach((slot, idx) => {

                    addSmallTent(

                        1.85,
                        1.85,

                    );

            });

            // -----------------------------------------------------------------

            // -----------------------------------------------------------------
            const zone7Ids = [

            // -----------------------------------------------------------------
            // [水色四角 8] 尚文館の西面沿い (博物館側): 42A〜48B (上から下へ14張)
            // -----------------------------------------------------------------
            const zone8Ids = [
                '42A', '42B', '43A', '43B', '44A', '44B', '45A', '45B',
                '46A', '46B', '47A', '47B', '48A', '48B'

            addCyanZoneBox(shobunGrp, -14.8, 3.0, 3.8, 35.0, 0);
            zone8Ids.forEach((id, idx) => {

                addSmallTent(shobunGrp, -14.8, lz, id, 0xd97706, '#fffbeb', 0, 1.85, 1.85, '尚文館西面(博物館側)');

            // -----------------------------------------------------------------
            // [水色四角 9 & 10] 博物館正面広場の2つの水色四角: (50B, 50A) と (49B, 49A)
            // -----------------------------------------------------------------
            // Upper light-blue box: 50B (top), 50A (bottom)
            addCyanZoneBox(festivalGrp, -47.2, 12.0, 4.2, 6.4, 0.18);
            addSmallTent(festivalGrp, -47.5, 10.6, '50B', 0xd97706, '#fffbeb', 0.18, 2.0, 2.0, '博物館正面広場(北側)');
            addSmallTent(festivalGrp, -46.9, 13.4, '50A', 0xd97706, '#fffbeb', 0.18, 2.0, 2.0, '博物館正面広場(北側)');

            // Lower light-blue box: 49B (top), 49A (bottom)

            addSmallTent(festivalGrp, -51.5, 25.8, '49A', 0xd97706, '#fffbeb', -0.45, 2.0, 2.0, '博物館正面広場(南側)');

            // -----------------------------------------------------------------
            // [赤い印の場所] 小さなゴミ箱・ゴミステーション配置 (全箇所)
            // -----------------------------------------------------------------
            // 1. ゴミ① (凜風館北側・第四学舎西側)

            // 4. 第二学舎西側 (9A南西・4B北の赤い印)

            // 5. ゴミ④ (右下・本部東側・南棟/チルコロ北側の赤い印)

            // 6. 総合図書館横芝生の南端 (41Bのすぐ下の赤い印)

        // ==========================================

        const tempV = new THREE.Vector3();
        function updatePoiPositions() {
            if (!poiContainerEl) poiContainerEl = document.getElementById('poi-container');
            if (!showLabels && !isTrashFocusMode) {
                if (poiContainerEl.style.display !== 'none') poiContainerEl.style.display = 'none';
                return;
            }
            if (poiContainerEl.style.display !== 'block') poiContainerEl.style.display = 'block';

            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;

            for (let i = 0; i < poiElements.length; i++) {
                const item = poiElements[i];
                const shouldShow = isTrashFocusMode ? item.isTrashBin : (!item.isTrashBin && showLabels);
                if (!shouldShow) {
                    if (item.visible !== false) {
                        item.element.style.display = 'none';
                        item.visible = false;
                    }
                    continue;
                }

                tempV.copy(item.worldPos);
                tempV.project(camera);

                if (tempV.z > 1) {
                    if (item.visible !== false) {
                        item.element.style.display = 'none';
                        item.visible = false;
                    }
                    continue;
                }

                const x = (tempV.x * halfW) + halfW;
                const y = -(tempV.y * halfH) + halfH;

                if (item.visible !== true) {
                    item.element.style.display = 'block';
                    item.visible = true;
                }

                const dist = camera.position.distanceTo(item.worldPos);
                const scale = Math.max(0.65, Math.min(1.08, 140 / dist));
                item.element.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) translate(-50%, -100%) scale(${scale.toFixed(2)})`;
            }
        }

        // ==========================================
        // 8. Interactive Camera Movement & Focus
        // ==========================================
        function animateCamera(targetCamPos, targetLookAt, duration = 1200) {
            new TWEEN.Tween(camera.position)
                .to({ x: targetCamPos[0], y: targetCamPos[1], z: targetCamPos[2] }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: targetLookAt[0], y: targetLookAt[1], z: targetLookAt[2] }, duration)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
        }

        function focusOnPoi(id, closer = false, forceShowCard = false) {
            const poi = findPlaceById(id);
            if (!poi) return;
            selectedPoiId = id;

            const tx = poi.pos[0];
            const tz = poi.pos[2];

            if (!is3D) {
                const topY = closer ? 150 : 210;
                animateCamera([tx, topY, tz + 1], [tx, 0, tz]);
            } else {
                const dx = poi.camPos[0] - tx;
                const dy = poi.camPos[1];
                const dz = poi.camPos[2] - tz;
                // Keep a comfortable, pulled-back framing so facilities are not over-zoomed
                const scale = closer ? 1.35 : 1.85;
                animateCamera(
                    [tx + dx * scale, Math.max(48, dy * scale), tz + dz * scale],
                    [tx, 0, tz]
                );
            }

            if (showLabels || forceShowCard) {
                showDetailCard(poi, forceShowCard);
            }
        }

        // Click Raycasting on 3D Buildings, Tents & Trash Bins (Skip when user was dragging the camera)
        function onPointerClick(e) {
            // Disable building tap explanation when facility navigation is hidden
            if (!showLabels && !isTrashFocusMode) return;
            if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 6) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, false);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const targetObj = hit.object;
                const poiId = (targetObj.userData && targetObj.userData.poiIds && hit.instanceId !== undefined)
                    ? targetObj.userData.poiIds[hit.instanceId]
                    : (targetObj.userData && targetObj.userData.poiId);
                if (poiId) {
                    focusOnPoi(poiId, false, isTrashFocusMode);
                }
            }
        }

        // ==========================================
        // 8.5 Museum Front Fireworks System (Dark Mode & Super Boost)
        // ==========================================
        const FIREWORK_PALETTES = [
            [0xffca28, 0xffe082, 0xff8f00], // Rich Gold & Amber
            [0xff4081, 0xff80ab, 0xffd54f], // Vivid Sakura Pink & Gold
            [0x00e5ff, 0x64ffda, 0xffeb3b], // Electric Cyan & Emerald Gold
            [0xd500f9, 0xff4081, 0xffe57f], // Royal Magenta & Gold
            [0xff5252, 0xffca28, 0x00e676, 0x40c4ff, 0xe040fb], // Rainbow Star
            [0xfff59d, 0xffd54f, 0xffb300, 0xffffff] // Golden Kamuro Willow
        ];

        function launchMuseumFirework(instantBurst = false, forceBoost = null) {
            if (!sparkTexture) sparkTexture = createSparkTexture();

            const boosted = forceBoost !== null ? forceBoost : isFireworkBoost;

            // Museum rotunda is at [-58, 0, 18], front plaza is around [-58, 0, 26]
            const spreadX = boosted ? 40 : 16;
            const spreadZ = boosted ? 22 : 8;
            const startX = -58 + (Math.random() - 0.5) * spreadX;
            const startZ = 26 + (Math.random() - 0.5) * spreadZ;
            const targetY = boosted ? (24 + Math.random() * 19) : (23 + Math.random() * 9);
            const palette = FIREWORK_PALETTES[Math.floor(Math.random() * FIREWORK_PALETTES.length)];

            const fw = {
                phase: instantBurst ? 'burst' : 'ascend',
                x: startX,
                y: instantBurst ? targetY : 1.5,
                z: startZ,
                targetY: targetY,
                vy: boosted ? (30 + Math.random() * 10) : (23 + Math.random() * 5),
                palette: palette,
                boosted: boosted,
                age: 0,
                maxLife: boosted ? (1.85 + Math.random() * 0.45) : (1.5 + Math.random() * 0.35),
                rocketMesh: null,
                burstPoints: null,
                velocities: []
            };

            if (!instantBurst) {
                const rocketGeo = new THREE.BufferGeometry();
                const posArr = new Float32Array(7 * 3);
                for (let i = 0; i < 7; i++) {
                    posArr[i * 3] = startX;
                    posArr[i * 3 + 1] = fw.y - i * 0.55;
                    posArr[i * 3 + 2] = startZ;
                }
                rocketGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
                const rocketMat = new THREE.PointsMaterial({
                    size: boosted ? 2.4 : 1.8,
                    map: sparkTexture,
                    color: palette[0],
                    transparent: true,
                    opacity: 0.98,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });
                fw.rocketMesh = new THREE.Points(rocketGeo, rocketMat);
                scene.add(fw.rocketMesh);
            } else {
                triggerFireworkBurst(fw);
            }

            fireworks.push(fw);
        }

        function triggerFireworkBurst(fw) {
            if (fw.rocketMesh) {
                scene.remove(fw.rocketMesh);
                fw.rocketMesh.geometry.dispose();
                fw.rocketMesh.material.dispose();
                fw.rocketMesh = null;
            }

            fw.phase = 'burst';
            fw.age = 0;

            const boosted = fw.boosted;
            const count = boosted ? (IS_MOBILE ? 130 : 230) : (IS_MOBILE ? 52 : 84);
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = fw.x;
                positions[i * 3 + 1] = fw.y;
                positions[i * 3 + 2] = fw.z;

                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);

                let shellSpeed;
                if (boosted) {
                    // Triple-shell super chrysanthemum + outer ring
                    if (i < count * 0.22) {
                        shellSpeed = 6.0 + (Math.random() - 0.5) * 2.0;
                    } else if (i < count * 0.66) {
                        shellSpeed = 12.8 + (Math.random() - 0.5) * 2.4;
                    } else {
                        shellSpeed = 18.2 + (Math.random() - 0.5) * 2.8;
                    }
                } else {
                    // Dual-shell peony firework (inner core + outer crown)
                    shellSpeed = (i < count * 0.32 ? 5.2 : 10.5) + (Math.random() - 0.5) * 1.8;
                }

                velocities.push({
                    vx: Math.sin(phi) * Math.cos(theta) * shellSpeed,
                    vy: Math.cos(phi) * shellSpeed + (boosted ? 1.8 : 1.2),
                    vz: Math.sin(phi) * Math.sin(theta) * shellSpeed
                });

                const col = new THREE.Color(fw.palette[i % fw.palette.length]);
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: boosted ? (IS_MOBILE ? 2.8 : 2.35) : (IS_MOBILE ? 2.1 : 1.75),
                map: sparkTexture,
                vertexColors: true,
                transparent: true,
                opacity: 1.0,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            fw.burstPoints = new THREE.Points(geo, mat);
            fw.velocities = velocities;
            scene.add(fw.burstPoints);

            // Flash museum front light with firework color
            if (fireworkLight && isNight) {
                fireworkLight.visible = true;
                fireworkLight.color.setHex(fw.palette[0]);
                fireworkLight.position.set(fw.x, fw.y, fw.z);
                fireworkLight.intensity = boosted ? 5.2 : 2.4;
                fireworkLight.distance = boosted ? 145 : 75;
            }
        }

        function updateMuseumFireworks(dt) {
            if (!isNight) return;

            fireworkTimer += dt;
            const interval = isFireworkBoost ? (IS_MOBILE ? 0.22 : 0.16) : (IS_MOBILE ? 0.8 : 0.68);
            const maxConcurrent = isFireworkBoost ? (IS_MOBILE ? 10 : 16) : (IS_MOBILE ? 3 : 4);

            if (fireworkTimer > interval) {
                fireworkTimer = 0;
                if (fireworks.length < maxConcurrent) {
                    launchMuseumFirework(false);
                    if (isFireworkBoost && Math.random() < 0.45 && fireworks.length < maxConcurrent) {
                        launchMuseumFirework(false);
                    }
                }
            }

            // Decay flash light smoothly
            if (fireworkLight && fireworkLight.intensity > 0.1) {
                fireworkLight.intensity *= Math.pow(0.18, dt);
                if (fireworkLight.intensity <= 0.1) fireworkLight.visible = false;
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                if (fw.phase === 'ascend') {
                    fw.y += fw.vy * dt;
                    if (fw.rocketMesh) {
                        const posAttr = fw.rocketMesh.geometry.attributes.position;
                        for (let j = 0; j < 7; j++) {
                            posAttr.setXYZ(j, fw.x + (Math.random() - 0.5) * 0.2, fw.y - j * 0.6, fw.z + (Math.random() - 0.5) * 0.2);
                        }
                        posAttr.needsUpdate = true;
                    }
                    if (fw.y >= fw.targetY) {
                        triggerFireworkBurst(fw);
                    }
                } else if (fw.phase === 'burst') {
                    fw.age += dt;
                    const progress = fw.age / fw.maxLife;
                    if (progress >= 1.0) {
                        if (fw.burstPoints) {
                            scene.remove(fw.burstPoints);
                            fw.burstPoints.geometry.dispose();
                            fw.burstPoints.material.dispose();
                        }
                        fireworks.splice(i, 1);
                        continue;
                    }

                    const posAttr = fw.burstPoints.geometry.attributes.position;
                    const drag = Math.pow(0.32, dt);
                    const gravity = 5.5 * dt;

                    for (let j = 0; j < fw.velocities.length; j++) {
                        const vel = fw.velocities[j];
                        vel.vx *= drag;
                        vel.vz *= drag;
                        vel.vy = vel.vy * drag - gravity;

                        const px = posAttr.getX(j) + vel.vx * dt;
                        const py = posAttr.getY(j) + vel.vy * dt;
                        const pz = posAttr.getZ(j) + vel.vz * dt;
                        posAttr.setXYZ(j, px, py, pz);
                    }
                    posAttr.needsUpdate = true;

                    // Smooth sparkle fade out
                    const baseSize = fw.boosted ? 2.35 : 1.75;
                    fw.burstPoints.material.opacity = Math.max(0, 1.0 - Math.pow(progress, 1.4));
                    fw.burstPoints.material.size = baseSize * (1.0 - progress * 0.3);
                }
            }
        }

        function clearMuseumFireworks() {
            fireworks.forEach(fw => {
                if (fw.rocketMesh) {
                    scene.remove(fw.rocketMesh);
                    fw.rocketMesh.geometry.dispose();
                    fw.rocketMesh.material.dispose();
                }
                if (fw.burstPoints) {
                    scene.remove(fw.burstPoints);
                    fw.burstPoints.geometry.dispose();
                    fw.burstPoints.material.dispose();
                }
            });
            fireworks = [];
            if (fireworkLight) fireworkLight.intensity = 0;
        }

        function updateFireworkBoostButtonUI() {
            const boostBtn = document.getElementById('firework-boost-btn');

                boostStatus.textContent = 'OFF';
                boostStatus.className = 'text-[10px] font-black px-1.5 py-0.5 rounded-md bg-white/15 text-amber-200 ml-1';
